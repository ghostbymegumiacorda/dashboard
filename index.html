  --lh: 1.5;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
  --rail: 256px;
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #efefeb; --line: #dcdcd5; --text: #1a1c21; --muted: #62666f;

}

}
:root[data-theme="dark"] { --bg: #0e1422; --surface: #151d30; --surface-2: #1c2640; --line: #2a3656; --text: #e7ecf7; --muted: #8e9ab5; --accent: #3fe0ff; --accent-ink: #04202a; color-scheme: dark; }

  --accent: #0f766e; --accent-ink: #ffffff; --accent-2: #b4400c; --ok: #15803d; --warn: #9a5600; --bad: #be2a2a;
  --texture: radial-gradient(900px 520px at 90% -10%, rgba(255,170,120,.18), transparent 60%);

  --bg: #edf5fb; --surface: #fafdff; --surface-2: #dcebf6; --line: #c3d7e9; --text: #0f243a; --muted: #475e75;
  --accent: #0369a1; --accent-ink: #ffffff; --accent-2: #a1470a; --ok: #13753a; --warn: #935200; --bad: #bb2633;
  --texture: radial-gradient(1000px 540px at 85% -10%, rgba(3,105,161,.07), transparent 60%);
  --glow: none; --lift: 0 1px 2px rgba(15,36,58,.06), 0 8px 20px -14px rgba(15,36,58,.28);
  color-scheme: light;
}
:root[data-contrast="high"] { --muted: var(--text); --line: color-mix(in srgb, var(--text) 50%, var(--bg)); }
:root[data-comfort="on"] { --lh: 1.75; }
:root[data-calm="on"] { --texture: none; --glow: none; }

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--texture), var(--bg); background-attachment: fixed; color: var(--text); font-family: var(--body); line-height: var(--lh); font-size: 1rem; }
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; letter-spacing: -0.015em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: .2rem 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.spacer { flex: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 1.25rem 0; }
kbd { font-family: var(--body); font-size: .72em; border: 1px solid currentColor; border-radius: 4px; padding: 0 .3em; opacity: .7; margin-left: .35em; }
.ico { flex: none; display: block; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 1.1rem; padding: 1.1rem .9rem;
}
.brand { display: flex; align-items: center; gap: .6rem; font-family: var(--display); font-weight: 800; font-size: 1.1rem; padding: 0 .35rem; }
.brand-mark { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 9px; background: var(--accent); color: var(--accent-ink); box-shadow: var(--glow); font-weight: 800; flex: none; }
.rail-subject { display: flex; flex-direction: column; gap: .35rem; padding: .7rem; border-radius: var(--r-md); background: var(--surface-2); }
.rail-label { font-size: .78rem; color: var(--muted); font-weight: 700; }
.subject-select { font-weight: 700; width: 100%; background: var(--surface) !important; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; font-size: .88rem; cursor: pointer; text-align: left; }
:root[data-skin="emerald"] .link-btn, :root[data-skin="light"] .link-btn { color: var(--accent); }
.rail-nav { display: flex; flex-direction: column; gap: .2rem; }
.rail-nav button {
  display: flex; align-items: center; gap: .7rem; border: 0; background: none; padding: .62rem .75rem; border-radius: var(--r-sm);
  cursor: pointer; color: var(--muted); font-weight: 700; text-align: left; font-size: .98rem; position: relative;
}
.rail-nav button:hover { background: var(--surface-2); color: var(--text); }
.rail-nav button.on { background: var(--accent-soft); color: var(--text); }
.rail-nav button.on::before { content: ""; position: absolute; left: -.9rem; top: .45rem; bottom: .45rem; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.rail-nav button.on .ico { color: var(--accent); }
:root[data-skin="emerald"] .rail-nav button.on .ico, :root[data-skin="light"] .rail-nav button.on .ico { color: var(--accent); }
.rail-nav .n { margin-left: auto; font-size: .78rem; background: var(--surface-2); border-radius: 999px; padding: .05rem .5rem; color: var(--muted); }
.rail-nav button.on .n { background: var(--surface); }
.quick-btn { justify-content: center; }
.rail-tools { margin-top: auto; display: flex; flex-direction: column; gap: .15rem; border-top: 1px solid var(--line); padding-top: .8rem; }
.rail-tools > button { display: flex; align-items: center; gap: .6rem; border: 0; background: none; padding: .5rem .75rem; border-radius: var(--r-sm); cursor: pointer; color: var(--muted); font-weight: 700; font-size: .92rem; text-align: left; }
.rail-tools > button:hover { background: var(--surface-2); color: var(--text); }
.theme-dots { display: flex; flex-wrap: wrap; gap: .5rem; padding: .5rem .75rem; }
.theme-dots button { width: 1.6rem; height: 1.6rem; border-radius: 50%; cursor: pointer; border: 2px solid var(--line); background: linear-gradient(135deg, var(--a) 0 50%, var(--b) 50% 100%); padding: 0; }
.theme-dots button.on { border-color: var(--text); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.save-note { display: flex; align-items: center; gap: .35rem; font-size: .78rem; color: var(--muted); padding: 0 .4rem; margin: 0; }
.save-note .ico { color: var(--ok); }

.content { min-width: 0; padding: 1.75rem clamp(1rem, 3vw, 2.5rem) 3rem; max-width: 1180px; width: 100%; }
.mobilebar, .bottom-nav, .mobile-only { display: none; }
.view { display: flex; flex-direction: column; gap: 1.2rem; }

@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mobile-only { display: flex; justify-content: center; margin-top: 1.5rem; }
  .mobilebar {
    display: flex; align-items: center; gap: .5rem; position: sticky; top: 0; z-index: 20;
    padding: calc(env(safe-area-inset-top, 0px) + .55rem) .8rem .55rem; margin-top: calc(-1 * env(safe-area-inset-top, 0px));
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .mobilebar .subject-select { flex: 1; min-width: 0; }
  .content { padding: 1.1rem .9rem calc(6rem + env(safe-area-inset-bottom, 0px)); }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: end; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: var(--surface); border-top: 1px solid var(--line); padding: .35rem .25rem calc(.35rem + env(safe-area-inset-bottom, 0px));
  }
  .bottom-nav > button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: .15rem; font-size: .72rem; font-weight: 700; color: var(--muted); padding: .3rem 0; cursor: pointer; }
  .bottom-nav > button.on { color: var(--text); }
  .bottom-nav > button.on .ico { color: var(--accent); }
  .bottom-nav .fab { width: 3.2rem; height: 3.2rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); justify-self: center; justify-content: center; margin-top: -1.4rem; box-shadow: var(--glow), 0 8px 20px -6px rgba(0,0,0,.45); }
  .bottom-nav .fab .ico { color: var(--accent-ink) !important; }
  .ico-wrap { position: relative; }
  .badge { position: absolute; top: -.35rem; right: -.7rem; background: var(--bad); color: #fff; font-size: .65rem; border-radius: 999px; padding: 0 .35rem; line-height: 1.3rem; min-width: 1.3rem; text-align: center; }
  .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 5.5rem) !important; }
}

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: .4rem; border: 1px solid var(--line); background: var(--surface); padding: .52rem .95rem; border-radius: var(--r-sm); cursor: pointer; font-weight: 700; line-height: 1.2; transition: border-color .15s, transform .1s; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: var(--glow); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger:not(.ghost) { background: var(--bad); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { background: transparent; border-color: var(--bad); color: var(--bad); }
:root[data-skin="slate"] .btn.ok, :root[data-skin="ateneo"] .btn.ok, :root[data-skin="lamplight"] .btn.ok, :root[data-skin="oled"] .btn.ok, :root[data-skin="sunset"] .btn.ok, :root[data-skin="ocean"] .btn.ok { color: #04140c; }
.icon-btn { display: grid; place-items: center; border: 1px solid transparent; background: none; cursor: pointer; width: 2.2rem; height: 2.2rem; border-radius: var(--r-sm); color: var(--muted); flex: none; }
.icon-btn:hover { color: var(--text); border-color: var(--line); }
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: .5rem .65rem; width: 100%; max-width: 100%;
}
select { width: auto; cursor: pointer; }
.field select { width: 100%; }
textarea { resize: vertical; line-height: 1.45; }
textarea.code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .85rem; white-space: pre; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 1.1rem; height: 1.1rem; margin: .2rem 0 0; flex: none; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.field { display: flex; flex-direction: column; gap: .3rem; margin-bottom: .85rem; }
.field-label { font-weight: 700; font-size: .9rem; }
.field-hint { font-size: .82rem; color: var(--muted); }
.check { display: flex; gap: .55rem; align-items: flex-start; cursor: pointer; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0 1rem; }
.row-end { display: flex; gap: .5rem; justify-content: flex-end; align-items: center; flex-wrap: wrap; margin-top: .5rem; }
.row-center { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; margin-top: .6rem; }
.error { color: var(--bad); font-weight: 700; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.1rem 1.2rem; box-shadow: var(--lift); }

.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .32rem .8rem; cursor: pointer; font-size: .88rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.chip:hover { color: var(--text); }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.on.ok { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.chip.on.bad { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.chip .n { opacity: .7; margin-left: .2rem; font-weight: 400; }
.chip-scroll { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .2rem; scrollbar-width: thin; }
.filters { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.search { max-width: 24rem !important; }
.seg-filter { display: inline-flex; flex-wrap: wrap; gap: .25rem; padding: .25rem; background: var(--surface-2); border-radius: var(--r-md); align-self: flex-start; max-width: 100%; }
.seg-filter button { border: 0; background: none; padding: .42rem .8rem; border-radius: var(--r-sm); cursor: pointer; font-weight: 700; font-size: .88rem; color: var(--muted); display: inline-flex; align-items: center; gap: .35rem; }
.seg-filter button:hover { color: var(--text); }
.seg-filter button.on { background: var(--surface); color: var(--text); box-shadow: var(--lift); }
.seg-filter .n { font-weight: 400; opacity: .7; }
.dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--st, var(--muted)); flex: none; }

.page-head { display: flex; align-items: flex-end; gap: .75rem 1rem; flex-wrap: wrap; justify-content: space-between; }
.page-title { font-size: clamp(1.7rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -0.025em; }
.page-head .muted { max-width: 60ch; }
.head-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.empty { border: 1px dashed var(--line); border-radius: var(--r-lg); padding: 1.6rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .35rem; }
.empty.big { padding: 3rem 1.5rem; background: var(--surface); }
.empty.big .ico { color: var(--accent); margin-bottom: .3rem; }

/* ---------- status colors ---------- */
[data-status="Not started"] { --st: var(--muted); }
[data-status="In progress"], [data-status="Reviewing"] { --st: var(--warn); }
[data-status="Mastered"], [data-status="Cleared"] { --st: var(--ok); }
[data-status="Active"] { --st: var(--bad); }
.status-select { border-color: var(--st) !important; color: var(--st); font-weight: 700; font-size: .88rem; padding: .3rem .5rem !important; }
.status-select option { color: var(--text); }
.bad-text { color: var(--bad); }

/* ---------- hero + signature week track ---------- */
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem 2rem; flex-wrap: wrap; }
.hero h1 { font-size: clamp(2.4rem, 7vw, 3.8rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin: .15rem 0 .25rem; }
.hero-code { color: var(--accent); font-weight: 500; }
:root[data-skin="emerald"] .hero-code, :root[data-skin="light"] .hero-code, :root[data-skin="sakura"] .hero-code, :root[data-skin="lavender"] .hero-code { color: var(--accent-2); }
.hero-figure { display: flex; flex-direction: column; align-items: center; gap: .1rem; font-size: .85rem; }
.ring { position: relative; width: 88px; height: 88px; }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--ok); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.ring-num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
.ring-num small { font-size: .9rem; color: var(--muted); font-weight: 500; }
.big-num { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 5vw, 2.5rem); line-height: 1.05; font-variant-numeric: tabular-nums; }

.track { list-style: none; margin: 0; padding: 0 0 .4rem; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(7.4rem, 1fr); gap: .4rem; overflow-x: auto; scrollbar-width: thin; }
.track-cell {
  width: 100%; height: 100%; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: .1rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: .6rem .7rem .8rem;
  position: relative; overflow: hidden; transition: border-color .15s, transform .15s;
}
.track-cell::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--st, var(--line)); }
.track-cell[data-status="Not started"]::after { background: var(--surface-2); }
.track-cell[data-status="Mastered"] { box-shadow: var(--glow); }
.track-cell:hover { border-color: var(--accent); transform: translateY(-2px); }
.track-wk { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.track-code { font-family: var(--display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.track-std { font-size: .8rem; color: var(--muted); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* exams are drawn like a ledger total: double rule above and below */
.track-cell.exam { background: transparent; border: 0; border-top: 4px double var(--text); border-bottom: 4px double var(--text); border-radius: 0; }
.track-cell.exam::after { display: none; }
.track-cell.exam .track-code { font-size: 1.05rem; }

/* ---------- Today ---------- */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 1.1rem; align-items: start; }
@media (max-width: 1100px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
.plan h2 { margin-bottom: .6rem; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 2.2rem 1fr; gap: .8rem; padding: .9rem 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; padding-top: .3rem; }
.step-num { width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--accent-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.step-body { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
.step-label { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; font-weight: 700; color: var(--muted); }
.step-title { font-size: 1.08rem; font-family: var(--display); font-weight: 700; line-height: 1.3; }
.step-detail { font-size: .9rem; }
.step-actions { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .45rem; }
.side-col { display: flex; flex-direction: column; gap: 1.1rem; }
.exam-panel { border-top: 4px double var(--text); }
.exam-panel h2 { font-size: 1.5rem; margin: .1rem 0 .7rem; }
.bar-lg { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.bar-lg span { display: block; height: 100%; background: var(--ok); border-radius: 5px; transition: width .5s ease; }
.exam-panel p { margin: .45rem 0; }
.topic-chips { display: flex; flex-wrap: wrap; gap: .35rem; margin: .4rem 0; }
.tchip { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: .2rem .6rem; font-size: .82rem; font-weight: 700; cursor: pointer; }
.tchip:hover { border-color: var(--accent); }
.mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.mini { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: .8rem .9rem; cursor: pointer; font-size: .85rem; color: var(--muted); font-weight: 700; box-shadow: var(--lift); }
.mini:hover { border-color: var(--accent); }
.mini-num { font-family: var(--display); font-size: 1.6rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
.mini-num.bad-text { color: var(--bad); }

/* ---------- roadmap topic cards ---------- */
.topic-list { display: flex; flex-direction: column; gap: .6rem; }
.topic-card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--st); border-radius: var(--r-md); box-shadow: var(--lift); }
.topic-card.open { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); border-left-color: var(--st); }
.topic-row { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto auto; gap: .9rem; align-items: center; padding: .85rem .9rem .85rem .8rem; }
.wk-col { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.wk-small { font-size: .7rem; color: var(--muted); font-weight: 700; }
.wk-num { font-family: var(--display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.topic-main { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.topic-title { font-family: var(--display); font-weight: 700; font-size: 1.1rem; line-height: 1.25; }
.topic-main:hover .topic-title { color: var(--accent); }
:root[data-skin="emerald"] .topic-main:hover .topic-title, :root[data-skin="light"] .topic-main:hover .topic-title { color: var(--accent); }
.topic-meta { display: flex; flex-wrap: wrap; gap: .3rem .7rem; align-items: center; font-size: .86rem; }
.std { display: inline-block; font-size: .8rem; font-weight: 700; padding: .05rem .5rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.code { display: inline-block; font-size: .78rem; font-weight: 800; color: var(--accent-ink); background: var(--accent); border-radius: 5px; padding: 0 .38em; margin-right: .45em; vertical-align: .12em; font-family: var(--body); }
.sub-progress { display: flex; align-items: center; gap: .5rem; font-size: .8rem; max-width: 18rem; }
.bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; min-width: 3rem; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-sm); padding: .2rem; gap: .15rem; }
.seg button { border: 0; background: none; padding: .38rem .6rem; border-radius: 6px; font-size: .8rem; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--st); color: var(--bg); }
.chev .ico { transition: transform .2s; }
.topic-card.open .chev .ico { transform: rotate(90deg); }
.detail { padding: .2rem 1.1rem 1.1rem calc(3.4rem + 1.7rem); display: flex; flex-direction: column; gap: .8rem; }
.callout { background: color-mix(in srgb, var(--warn) 14%, transparent); border-left: 3px solid var(--warn); padding: .6rem .8rem; border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: .9rem; margin: 0; }
.subs { list-style: none; margin: 0; padding: 0; columns: 2 19rem; column-gap: 2rem; }
.subs li { display: flex; justify-content: space-between; gap: .75rem; padding: .3rem 0; break-inside: avoid; border-bottom: 1px dotted var(--line); }
.subs li.done span:not(.page) { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.page { color: var(--muted); font-size: .8rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.page.supp { color: var(--warn); font-weight: 700; }
.detail-actions { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.detail .field { margin-bottom: 0; }
.exam-card { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) minmax(8rem, 12rem) auto; gap: .9rem; align-items: center; padding: .85rem .9rem .85rem .8rem; border-top: 4px double var(--text); border-bottom: 4px double var(--text); margin: .25rem 0; }
.exam-ready { display: flex; flex-direction: column; gap: .3rem; font-size: .85rem; }
@media (max-width: 760px) {
  .topic-row { grid-template-columns: 2.8rem minmax(0, 1fr) auto; gap: .65rem; }
  .topic-row .seg { grid-column: 1 / -1; justify-self: stretch; display: grid; grid-template-columns: repeat(3, 1fr); }
  .topic-row .chev { grid-row: 1; grid-column: 3; }
  .detail { padding: .2rem .9rem 1rem; }
  .exam-card { grid-template-columns: 2.8rem minmax(0, 1fr) auto; }
  .exam-card .exam-ready { grid-column: 1 / -1; grid-row: 2; }
  .wk-num { font-size: 1.3rem; }
}

.book .disclosure { display: flex; align-items: center; gap: .55rem; width: 100%; border: 0; background: none; padding: 0; cursor: pointer; font-weight: 700; text-align: left; flex-wrap: wrap; }
.book .disclosure .muted { font-weight: 400; font-size: .9rem; }
.chev-i { margin-left: auto; transition: transform .2s; }
.chev-i.up { transform: rotate(90deg); }
.book-list { margin: .9rem 0 0; padding: 0; list-style: none; columns: 2 22rem; column-gap: 2rem; font-size: .9rem; }
.book-list li { display: flex; justify-content: space-between; gap: .75rem; padding: .25rem 0; border-bottom: 1px dotted var(--line); break-inside: avoid; color: var(--muted); }
.book-list li.in { color: var(--text); font-weight: 700; }

/* ---------- flashcards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .9rem; }
.flash { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; box-shadow: var(--lift); }
.flash[data-conf="known"] { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }
.flash[data-conf="again"] { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); }
.flash-face { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; perspective: 1200px; flex: 1; }
.flash-inner { display: grid; transition: transform .45s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; height: 100%; }
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.side { grid-area: 1 / 1; display: flex; flex-direction: column; gap: .5rem; padding: 1.05rem 1.05rem .85rem; backface-visibility: hidden; -webkit-backface-visibility: hidden; min-height: 10rem; background: var(--surface); }
.side.back { transform: rotateY(180deg); background: var(--surface-2); }
.flash-topic { font-size: .78rem; font-weight: 700; color: var(--accent-2); }
:root[data-skin="slate"] .flash-topic { color: var(--accent); }
.flash-q { font-family: var(--display); font-weight: 700; font-size: 1.1rem; line-height: 1.3; }
.flash-a { line-height: var(--lh); }
.flash-hint { margin-top: auto; font-size: .78rem; color: var(--muted); }
.flash-tip { font-size: .88rem; border-top: 1px dashed var(--line); padding-top: .45rem; color: var(--muted); }
.flash-actions { display: flex; gap: .35rem; align-items: center; padding: .5rem .6rem; border-top: 1px solid var(--line); }
:root[data-calm="on"] .flash-inner { transition: none; }

.drill { max-width: 44rem; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 1rem; padding: 1.6rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--lift); }
.drill-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .88rem; gap: 1rem; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.drill-q { font-family: var(--display); font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 700; line-height: 1.3; }
.drill-a { border-top: 1px solid var(--line); padding-top: 1rem; display: flex; flex-direction: column; gap: .6rem; }
.drill-btns { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
.reveal { align-self: flex-start; }
.drill.done { text-align: center; align-items: center; }

/* ---------- analytics ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: .8rem; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: .95rem 1.05rem; display: flex; flex-direction: column; gap: .15rem; box-shadow: var(--lift); }
.stat-label { font-weight: 700; font-size: .88rem; }
.stat .muted { font-size: .84rem; }
.stat.lead { border-color: var(--accent); box-shadow: var(--glow), var(--lift); }
.stat.weak ul { list-style: none; margin: .35rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .32rem; }
.stat.weak li { display: grid; grid-template-columns: minmax(0, 7rem) 1fr auto; gap: .5rem; align-items: center; font-size: .84rem; }
.stat.weak .bar span { background: var(--bad); }
.wk-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); box-shadow: var(--lift); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th { text-align: left; font-weight: 700; color: var(--muted); font-size: .8rem; padding: .65rem .75rem; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: .65rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
.mistakes { min-width: 980px; }
.mistakes tbody tr { box-shadow: inset 4px 0 0 var(--st); }
.mistakes .wrong { color: var(--bad); }
.mistakes .right { color: var(--ok); font-weight: 700; }
.mistakes tr[data-status="Cleared"] td { opacity: .6; }
.nowrap { white-space: nowrap; }
@media (max-width: 760px) {
  .table-wrap:has(.mistakes) { overflow: visible; border: 0; background: none; box-shadow: none; }
  .mistakes { min-width: 0; }
  .mistakes thead { display: none; }
  .mistakes tbody { display: flex; flex-direction: column; gap: .7rem; }
  .mistakes tr { display: grid; grid-template-columns: 1fr 1fr; gap: .2rem .8rem; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--st); border-radius: var(--r-md); padding: .8rem .9rem; position: relative; box-shadow: var(--lift) !important; }
  .mistakes td { border: 0; padding: .2rem 0; }
  .mistakes td::before { content: attr(data-label); display: block; font-size: .72rem; font-weight: 700; color: var(--muted); }
  .mistakes td.q, .mistakes td[data-label^="Trap"] { grid-column: 1 / -1; }
  .mistakes td.q { font-weight: 700; }
  .mistakes td.edit-cell { position: absolute; top: .4rem; right: .4rem; padding: 0; }
  .mistakes td.edit-cell::before { display: none; }
  .mistakes td.nowrap { white-space: normal; }
}
.quiz-history summary { cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: .5rem; list-style: none; }
.quiz-history summary::-webkit-details-marker { display: none; }
.quiz-list { list-style: none; margin: .8rem 0 0; padding: 0; display: flex; flex-direction: column; }
.quiz-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(4rem, 8rem) auto auto; gap: .7rem; align-items: center; padding: .45rem 0; border-top: 1px solid var(--line); font-size: .9rem; }
@media (max-width: 560px) { .quiz-list li { grid-template-columns: 1fr auto auto; } .quiz-list .bar { display: none; } .quiz-list li > span:first-child { grid-column: 1 / -1; } }

/* ---------- modal ---------- */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(5, 8, 15, .55); backdrop-filter: blur(3px); display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 1rem) 1rem calc(env(safe-area-inset-bottom, 0px) + 1rem); }
.modal { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-lg); width: min(34rem, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 24px 70px rgba(0,0,0,.4); }
.modal.wide { width: min(46rem, 100%); }
.modal:focus { outline: none; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 1.05rem 1.25rem .5rem; }
.modal-body { padding: .5rem 1.25rem 1.1rem; overflow-y: auto; }
.modal-foot { display: flex; gap: .5rem; align-items: center; padding: .85rem 1.25rem; border-top: 1px solid var(--line); flex-wrap: wrap; }
@media (max-width: 560px) {
  .backdrop { place-items: end center; padding: 0; }

}

/* ---------- fixes ---------- */

.grid-2.tight { gap: .5rem; margin-top: .5rem; }
.panel-row { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .7rem; }
.streak { display: inline-flex; align-items: center; gap: .25rem; font-weight: 700; color: var(--warn); font-size: .9rem; }

/* ---------- focus timer ---------- */
.focus-bar { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem); display: flex; align-items: center; gap: .6rem; padding: .45rem .5rem .45rem .7rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--lift), 0 14px 34px -14px rgba(0,0,0,.55); max-width: calc(100% - 1.5rem); }

.custom-editor { border: 1px solid var(--line); border-radius: var(--r-md); padding: .9rem 1rem; display: flex; flex-direction: column; gap: .65rem; background: var(--surface-2); margin-bottom: .5rem; }
.custom-top { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
.custom-top .inline-field { margin: 0; }
.color-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .5rem; }
.color-field { display: flex; align-items: center; gap: .55rem; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; }

/* ---------- reach every part of the screen (iPad/iPhone Safari, small laptop windows) ----------
   Safari's 100vh is the height with its toolbars hidden, so anything sized with vh ran under the toolbar.
   dvh is the height you can actually see; vh stays first as a fallback for older browsers. */
.rail { height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
.shell { min-height: 100vh; min-height: 100dvh; }
.backdrop { height: 100vh; height: 100dvh; overscroll-behavior: contain; }
.modal-body { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; min-height: 0; }
@media (min-width: 561px) { .modal { max-height: calc(100vh - 2rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); max-height: calc(100dvh - 2rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 560px) { .modal, .modal.wide { max-height: 92vh; max-height: 92dvh; } }
/* short screens (phone sideways, laptop at 125% zoom): popups use the full height */
@media (max-height: 560px) { .backdrop { place-items: start center; padding-top: calc(env(safe-area-inset-top, 0px) + .4rem); padding-bottom: .4rem; } .modal, .modal.wide { max-height: calc(100dvh - .8rem); } }
/* the focus-timer bar never covers the end of the page */
.shell:has(.focus-bar) .content { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6.5rem); }
@media (max-width: 899px) { .shell:has(.focus-bar) .content { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 11rem); } }
