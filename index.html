  }
  /* ----- built-in sample: PAS 7 (CFAS) ----- */
  const PS_SAMPLE_PAS7 = {"subject": "CFAS", "lectures": [{"topic": "PAS 7", "title": "PAS 7 Statement of Cash Flows", "source": "Millan, Conceptual Framework & Accounting Standards (2020), pp. 170–183", "summary": "PAS 7 tells you how to present where an entity's cash came from and where it went during the period. Every cash flow is sorted into operating, investing or financing activities. Only transactions that actually moved cash or cash equivalents go in the statement; the rest are disclosed. Operating cash flows can be shown with the direct or the indirect method, and the exam mostly tests classification, the 3-month rule for cash equivalents, and squeezing cash amounts out of accrual figures.", "sections": [{"heading": "Overview and objective", "body": "The statement of cash flows shows the **historical changes in cash and cash equivalents** (sources and uses) during the period. It is part of a complete set of financial statements.\n\nUsed with the other statements, it helps users judge:\n- the entity's ability to generate cash and cash equivalents\n- the timing and certainty of those cash flows\n- the entity's needs for cash\n\nIt also says something about **quality of earnings**: an entity can report a profit under accrual accounting yet have negative operating cash flows (for example, when receivables are hard to collect). Because it is prepared on a **cash basis**, it improves comparability between entities that use different accounting policies for the same transactions."}, {"heading": "Key definitions: cash and cash equivalents", "body": "- **Cash**: cash on hand and demand deposits (cash in bank).\n- **Cash equivalents**: short-term, highly liquid investments that are readily convertible to known amounts of cash and have an insignificant risk of changes in value.\n- **Cash flows**: inflows and outflows of cash and cash equivalents.\n\n**The 3-month rule:** a debt instrument is a cash equivalent only if it was **acquired within 3 months of its maturity date**. It is the term remaining when acquired that counts, not the time left at year-end.\n\n| Item | Cash equivalent? | Why |\n|---|---|---|\n| 1-year T-bill bought 3 months before maturity | Yes | Acquired within 3 months of maturity |\n| 6-month T-bill bought at issue, 2 months left at year-end | No | Term was 6 months when acquired |\n| 90-day money market placement or commercial paper | Yes | Maturity of 3 months or less |\n| 3-month time deposit | Yes | Original term of 3 months |\n| Sinking fund, restricted deposit for non-current use | No | Not available for current use |\n| Postdated customer check, employee IOU | No | These are receivables |"}, {"heading": "General rule: what goes in the statement", "body": "**Only transactions that affected cash and cash equivalents are reported.** Non-cash transactions are excluded and disclosed only.\n\nInclude, for example, the purchase of an asset paid in cash.\nExclude, for example:\n- buying an asset by issuing a note payable or shares\n- converting debt into equity\n- stock dividends\n\nIf part of a transaction is paid in cash (such as a 10% down payment on equipment with a note for the rest), only the cash part is reported: the down payment is an investing outflow and the note is disclosed as non-cash."}, {"heading": "Classification: operating, investing, financing", "body": "| Activity | It affects | Examples |\n|---|---|---|\n| **Operating** | Profit or loss (the main revenue-producing activities) | Collections from customers; payments to suppliers and employees; payments for operating expenses; income taxes paid or refunded; buying and selling held-for-trading securities |\n| **Investing** | Non-current assets and other investments | Buying or selling PPE, investment property and intangibles; buying or selling debt or equity instruments of other entities (not cash equivalents, not held for trading); loans to others and their collection (non-financial entities) |\n| **Financing** | Equity and borrowings | Issuing or redeeming shares; issuing or repaying notes, loans, bonds and mortgages; principal portion of lease payments by a lessee |\n\n**Special operating items:**\n- Cash flows from **held-for-trading securities** are operating; they are like inventory, bought to resell.\n- An entity that routinely makes or buys PPE to **rent out and later sell** treats the acquisition, rentals and sale proceeds as operating.\n- **Loans of a bank or other financial institution** are operating, because lending is its main revenue activity.\n\n**Trade versus non-trade liabilities:** payments of trade payables, accrued expenses and other operating liabilities are **operating**. Only non-trade (non-operating) liabilities produce financing cash flows."}, {"heading": "Interest and dividends: Option 1 and Option 2", "body": "Entities other than financial institutions may choose:\n\n| Cash flow | Option 1 | Option 2 |\n|---|---|---|\n| Interest received | Operating | Investing |\n| Interest paid | Operating | Financing |\n| Dividends received | Operating | Investing |\n| Dividends paid | Financing | Operating |\n\n- **Option 1 reasoning:** interest and dividend income and interest expense enter profit or loss; dividends paid are transactions with owners.\n- **Option 2 reasoning:** income from investments is investing; interest expense is a cost of borrowing; dividends paid are shown as operating to help users judge whether the entity can pay dividends out of operations.\n\n**Rules to remember:**\n- Financial institutions may use **Option 1 only**.\n- If an exam problem is silent, **assume Option 1**.\n- Only interest and dividends **actually received or paid** are reported. Dividends declared in Year 1 and paid in Year 2 appear only in Year 2."}, {"heading": "Items left out of the three activities", "body": "- **Moving money between cash and cash equivalents** (such as buying a 60-day placement) is cash management, not an activity.\n- **Bank overdrafts:** if they **cannot** be offset against cash, they are financing activities. If they are repayable on demand and part of cash management, they are part of cash and cash equivalents.\n- **Foreign currency:** cash flows are translated at the spot rate on the date of the flow. Exchange differences are not cash flows, but the effect of rate changes on cash held in a foreign currency is shown **separately**, to reconcile beginning and ending cash."}, {"heading": "Presentation: direct and indirect method", "body": "For **operating activities** only, PAS 7 allows two methods:\n- **Direct method:** shows each major class of gross cash receipts and gross cash payments. PAS 7 **encourages** it because it helps estimate future cash flows.\n- **Indirect method:** starts from profit or loss and adjusts for non-cash items and changes in operating assets and liabilities. It is the method used more in practice.\n\nBoth give the same net cash from operating activities. **Investing and financing activities always show gross receipts and gross payments** separately, unless they qualify for net presentation."}, {"heading": "How to compute the direct-method lines (the squeezes)", "body": "Each line starts from an income-statement amount and is adjusted by its related balance-sheet accounts. When in doubt, draw the T-account and squeeze the cash figure.\n\n| Cash flow | Start with | Add | Deduct |\n|---|---|---|---|\n| Cash received from customers | Net sales | Decrease in AR; increase in unearned revenue | Increase in AR; decrease in unearned revenue; write-offs (gross AR) or bad debt expense (net AR) |\n| Cash paid to suppliers | Cost of goods sold | Increase in inventory; decrease in AP; increase in advances to suppliers | Decrease in inventory; increase in AP |\n| Cash paid for expenses | The expense | Increase in prepaid; decrease in accrued | Decrease in prepaid; increase in accrued; non-cash expenses |\n| Interest paid | Interest expense | Decrease in interest payable; premium amortization on bonds payable | Increase in interest payable; discount amortization on bonds payable |\n| Income taxes paid | Income tax expense | Decrease in tax payable; increase in DTA | Increase in tax payable; increase in DTL |\n\n**Suppliers take two steps:** the inventory account gives purchases (COGS + ending inventory − beginning inventory), then the payables account gives payments."}, {"heading": "How to build the indirect method", "body": "1. Start with profit (the book's illustration starts with **profit before tax**).\n2. Add back non-cash expenses and losses: depreciation, amortization, impairment, losses on sale of assets, discount amortization on bonds payable.\n3. Deduct non-cash income and gains: gains on sale, unrealized gains on trading securities, share in profit of an associate.\n4. In the book's format, also add back **interest expense** and deduct **interest and dividend income**, because the actual cash interest and dividends are shown as separate lines.\n5. Adjust for working capital: **increase in an operating asset → deduct; decrease → add. Increase in an operating liability → add; decrease → deduct.**\n6. The subtotal is **cash generated from operations**. Then show interest paid, interest and dividends received (Option 1) and income taxes paid.\n\n**Example (from the book's illustration):** profit before tax 250, depreciation +30, gain on sale (10), impairment +5, interest expense +12, increase in receivables (150), decrease in inventories +3, decrease in payables (60) → cash generated 80; interest paid (10); taxes paid (20) → net cash from operating activities **50**. The direct method gives the same 50."}, {"heading": "Subsidiaries and other business units", "body": "- Acquiring or disposing of a subsidiary **when control is obtained or lost** → **investing** activity, shown net of the cash acquired or disposed of.\n- Changes in ownership that **do not** change control (buying more shares of a subsidiary you already control) → **financing** activity, as a transaction with owners."}, {"heading": "Disclosure", "body": "- The components of cash and cash equivalents, reconciled to the amounts in the statement of financial position.\n- Significant cash balances held by the entity that are **not available for use** by the group, with management's commentary.\n- Non-cash investing and financing transactions."}, {"heading": "Common exam traps", "body": "- Using the time to maturity **at year-end** instead of **when acquired** for the 3-month rule.\n- Reporting **dividends declared** instead of dividends paid.\n- Treating trade payables as financing (they are operating).\n- Putting held-for-trading purchases in investing (they are operating).\n- Adding back bad debt expense while using the change in **net** receivables.\n- Counting a whole asset purchase as cash when part was paid with a note or shares.\n- Thinking the direct/indirect choice applies to investing and financing too.\n- Assuming Option 2 when the problem is silent: the default is Option 1."}, {"heading": "Summary table", "body": "| Question | Answer |\n|---|---|\n| Basis of preparation | Cash basis |\n| Activities | Operating, investing, financing |\n| Non-cash transactions | Excluded; disclosed |\n| Methods for operating activities | Direct (encouraged) or indirect |\n| Investing and financing | Gross amounts |\n| Default for interest and dividends | Option 1 |\n| FX effect on cash | Separate reconciling line |\n| Control obtained or lost | Investing |\n| Ownership change without loss of control | Financing |"}], "keyTerms": [{"term": "Cash", "meaning": "Cash on hand and demand deposits."}, {"term": "Cash equivalents", "meaning": "Short-term, highly liquid investments readily convertible to known amounts of cash with insignificant risk of changes in value; debt instruments qualify only if acquired within 3 months of maturity."}, {"term": "Cash flows", "meaning": "Inflows and outflows of cash and cash equivalents."}, {"term": "Operating activities", "meaning": "The principal revenue-producing activities of the entity, and other activities that are not investing or financing; they generally affect profit or loss."}, {"term": "Investing activities", "meaning": "Acquisition and disposal of non-current assets and other investments not included in cash equivalents."}, {"term": "Financing activities", "meaning": "Activities that change the size and composition of the entity's equity and borrowings."}, {"term": "Direct method", "meaning": "Presents operating cash flows by major classes of gross cash receipts and gross cash payments."}, {"term": "Indirect method", "meaning": "Adjusts profit or loss for non-cash items and changes in operating assets and liabilities to arrive at operating cash flows."}, {"term": "Cash generated from operations", "meaning": "Operating cash flow before interest, dividends and income taxes are shown separately."}, {"term": "Non-cash transaction", "meaning": "An investing or financing transaction that does not use cash or cash equivalents; it is disclosed, not presented in the statement."}], "checkQuestions": [{"question": "A 1-year treasury bill is bought 2 months before it matures. Is it a cash equivalent?", "answer": "Yes. It was acquired within 3 months of maturity."}, {"question": "Where is interest paid presented by a non-financial entity when the problem is silent?", "answer": "Operating activities (Option 1)."}, {"question": "Equipment is bought with a 10% down payment and a note for the rest. How is it reported?", "answer": "The down payment is an investing outflow; the note portion is a non-cash transaction, disclosed only."}, {"question": "Under the indirect method, what do you do with an increase in prepaid expenses?", "answer": "Deduct it from profit."}, {"question": "Cash dividends were declared in 20x1 and paid in 20x2. Where do they appear?", "answer": "Only in the 20x2 statement, as a financing outflow under Option 1."}, {"question": "Which section reports buying more shares in a subsidiary you already control?", "answer": "Financing activities, because control did not change."}]}], "problemSets": [{"topic": "PAS 7", "title": "PAS 7 Set 1: Squeezes, classification and methods", "source": "Built on Millan, CFAS (2020), pp. 170–183", "instructions": "Ground rules for every problem unless the problem says otherwise: the entity is a **non-financial entity**, it uses **Option 1** for interest and dividends (interest and dividends received and interest paid are operating; dividends paid are financing), the reporting date is December 31, 20x2, and amounts are in Philippine pesos (₱). Use a T-account for every squeeze; that is the skill being trained here.", "problems": [{"no": 1, "title": "Cash and cash equivalents", "problem": "Entity A had the following items on December 31, 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Cash on hand (includes a customer's postdated check of ₱20,000 and an employee IOU of ₱5,000) | 75,000 |\n| Cash in bank – BDO current account | 480,000 |\n| Cash in bank – BDO savings account | 220,000 |\n| Bank overdraft – Metrobank (Entity A has no other account in Metrobank; the overdraft is not part of its cash management) | (35,000) |\n| Petty cash fund (unreplenished expense receipts of ₱2,500 are in the fund box) | 10,000 |\n| Sinking fund for bonds payable due in 20x5 | 300,000 |\n| 3-month time deposit, acquired Dec. 1, 20x2, maturing Feb. 28, 20x3 | 150,000 |\n| 6-month treasury bill, acquired Oct. 1, 20x2, maturing Mar. 31, 20x3 | 200,000 |\n| 1-year treasury bill, acquired Nov. 15, 20x2, maturing Jan. 31, 20x3 | 100,000 |\n| 60-day money market placement | 120,000 |\n| Traveler's checks | 15,000 |\n| Postage stamps | 1,200 |", "requirements": ["How much is reported as cash and cash equivalents on December 31, 20x2?", "How should the Metrobank overdraft be presented in the statement of financial position?"], "answer": "(a) ₱1,142,500\n(b) current liability, not offset", "solution": "| Item | Included | Reason |\n|---|---|---|\n| Cash on hand: 75,000 − 20,000 − 5,000 | 50,000 | Postdated check is a receivable; IOU is a receivable |\n| BDO current account | 480,000 | Cash in bank |\n| BDO savings account | 220,000 | Cash in bank |\n| Metrobank overdraft | – | Cannot be offset (no other Metrobank account); liability |\n| Petty cash: 10,000 − 2,500 | 7,500 | Unreplenished receipts are expenses already spent |\n| Sinking fund | – | Restricted for noncurrent use; noncurrent asset |\n| 3-month time deposit | 150,000 | Original maturity of 3 months |\n| 6-month T-bill | – | Acquired 6 months before maturity |\n| 1-year T-bill acquired 2.5 months before maturity | 100,000 | Acquired within 3 months of maturity |\n| 60-day money market | 120,000 | Maturity of 3 months or less |\n| Traveler's checks | 15,000 | Readily usable as cash |\n| Postage stamps | – | Prepaid expense |\n| **Cash and cash equivalents** | **1,142,500** |  |\n\n(b) Report the ₱35,000 overdraft as a current liability. If it were repayable on demand and part of cash management, it would be deducted within cash and cash equivalents instead (book p. 173).", "subtopic": "Cash and cash equivalents", "difficulty": "easy", "approach": "Go item by item: cash on hand and in bank count; debt instruments count only if acquired within 3 months of maturity; restricted funds, receivables in disguise (postdated checks, IOUs) and prepaid items do not.", "trap": "Counting a 6-month T-bill because it matures within 3 months of year-end. What matters is the term when it was acquired."}, {"no": 2, "title": "Classification", "problem": "Classify each item as **O** (operating), **I** (investing), **F** (financing), **N** (non-cash; disclose only) or **X** (not reported because it is a movement between cash and cash equivalents).\n\n| # | Transaction |\n|---|---|\n| 1 | Cash received from sale of goods |\n| 2 | Purchase of held-for-trading (FVPL) securities |\n| 3 | Purchase of equity securities designated at FVOCI |\n| 4 | Interest received on a loan to an affiliate |\n| 5 | Cash dividends paid to shareholders |\n| 6 | Dividends received from an investment |\n| 7 | Interest paid on bank loan |\n| 8 | Income taxes paid |\n| 9 | Proceeds from issuing bonds |\n| 10 | Acquisition of a building by issuing ordinary shares |\n| 11 | Purchase of 60-day commercial paper |\n| 12 | Principal portion of lease payments (PFRS 16) |\n| 13 | Payments for short-term leases (PFRS 16 exemption) |\n| 14 | Cash advances to a supplier for future inventory deliveries |\n| 15 | Loan granted to an officer |\n| 16 | Proceeds from selling rental equipment that the entity routinely rents out and then sells |\n| 17 | Payment of accounts payable to trade suppliers |\n| 18 | Repayment of the principal of a bank loan |\n| 19 | Conversion of preference shares into ordinary shares |\n| 20 | Purchase of additional shares in a subsidiary that is already controlled |", "requirements": [], "answer": "See classification table in the solution", "solution": "| # | Class | # | Class |\n|---|---|---|---|\n| 1 | O | 11 | X (cash equivalent) |\n| 2 | O (held for trading) | 12 | F |\n| 3 | I | 13 | O |\n| 4 | O (Option 1) | 14 | O |\n| 5 | F (Option 1) | 15 | I |\n| 6 | O (Option 1) | 16 | O (special item, book p. 172) |\n| 7 | O (Option 1) | 17 | O |\n| 8 | O | 18 | F |\n| 9 | F | 19 | N |\n| 10 | N | 20 | F (no change in control) |", "subtopic": "Classification of cash flows", "difficulty": "easy", "approach": "Ask what the cash flow affects: profit or loss → operating; non-current assets and investments → investing; borrowings and equity → financing. No cash moved → non-cash disclosure.", "trap": "Classifying interest received as investing or dividends paid as operating when the problem is silent. The default is Option 1."}, {"no": 3, "title": "Cash received from customers (allowance method)", "problem": "Entity B provided the following for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Total gross sales (of which ₱500,000 were cash sales) | 3,200,000 |\n| Sales returns (all on account) | 25,000 |\n| Sales discounts taken by customers | 18,000 |\n| Bad debt expense | 35,000 |\n| Accounts previously written off, reinstated and collected during 20x2 | 4,000 |\n| Accounts receivable (gross): Jan. 1 / Dec. 31 | 400,000 / 520,000 |\n| Allowance for doubtful accounts: Jan. 1 / Dec. 31 | 30,000 / 42,000 |", "requirements": ["How much were the accounts written off during 20x2?", "How much was collected on accounts receivable?", "How much is \"cash received from customers\" in the direct method?"], "answer": "(a) ₱27,000\n(b) ₱2,514,000\n(c) ₱3,014,000", "solution": "**Allowance for doubtful accounts**\n| Debit | | Credit | |\n|---|---|---|---|\n| **Write-offs (squeeze)** | **27,000** | Beginning balance | 30,000 |\n| Ending balance | 42,000 | Bad debt expense | 35,000 |\n|  |  | Recovery reinstated | 4,000 |\n| **Total** | **69,000** | **Total** | **69,000** |\n\n**Accounts receivable (gross)**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning balance | 400,000 | Sales returns | 25,000 |\n| Credit sales (3,200,000 − 500,000) | 2,700,000 | Sales discounts | 18,000 |\n| Recovery reinstated | 4,000 | Write-offs | 27,000 |\n|  |  | **Collections (squeeze)** | **2,514,000** |\n|  |  | Ending balance | 520,000 |\n| **Total** | **3,104,000** | **Total** | **3,104,000** |\n\nCash received from customers = collections on account ₱2,514,000 + cash sales ₱500,000 = **₱3,014,000**.\n\nShortcut using net receivables: net sales (3,200,000 − 25,000 − 18,000) 3,157,000 − bad debt expense 35,000 − increase in net AR (478,000 − 370,000) 108,000 = ₱3,014,000. Under the net approach you deduct bad debt expense, not write-offs.", "subtopic": "Cash received from customers", "difficulty": "average", "approach": "Build the Allowance T-account first to squeeze write-offs, then the AR T-account to squeeze collections. Add cash sales.", "trap": "Forgetting that a recovery is first reinstated (debit AR) and then collected."}, {"no": 4, "title": "Cash received from customers (notes and customer advances)", "problem": "Entity C uses the direct write-off method. Data for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Sales revenue | 5,000,000 |\n| Accounts written off as uncollectible | 20,000 |\n| Accounts receivable: Jan. 1 / Dec. 31 | 600,000 / 450,000 |\n| Trade notes receivable (all from customers): Jan. 1 / Dec. 31 | 200,000 / 350,000 |\n| Customer advances (contract liability): Jan. 1 / Dec. 31 | 80,000 / 130,000 |\n| Accounts receivable converted to notes receivable during 20x2 | 180,000 |", "requirements": ["How much is the cash received from customers?"], "answer": "₱5,030,000", "solution": "The conversion of ₱180,000 AR into notes is a transfer between two customer receivable accounts, so it has no cash effect. Combine all customer accounts:\n\n| Particulars | Amount |\n|---|---|\n| Sales revenue | 5,000,000 |\n| Less: accounts written off (direct write-off) | (20,000) |\n| Change in AR + trade NR: (600,000 + 200,000) − (450,000 + 350,000) | 0 |\n| Add: increase in customer advances (130,000 − 80,000) | 50,000 |\n| **Cash received from customers** | **5,030,000** |", "subtopic": "Cash received from customers", "difficulty": "average", "approach": "Combine all customer accounts (AR, trade notes, advances). Transfers between them have no cash effect.", "trap": "Treating the AR-to-note conversion as a collection."}, {"no": 5, "title": "Cash paid to suppliers (basic two-step)", "problem": "| Particulars | Amount |\n|---|---|\n| Cost of goods sold | 2,400,000 |\n| Inventory: Jan. 1 / Dec. 31 | 350,000 / 420,000 |\n| Accounts payable (trade): Jan. 1 / Dec. 31 | 280,000 / 230,000 |", "requirements": ["How much were the purchases?", "How much is the cash paid to suppliers?"], "answer": "(a) ₱2,470,000\n(b) ₱2,520,000", "solution": "**Inventory**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning | 350,000 | Cost of goods sold | 2,400,000 |\n| **Purchases (squeeze)** | **2,470,000** | Ending | 420,000 |\n| **Total** | **2,820,000** | **Total** | **2,820,000** |\n\n**Accounts payable**\n| Debit | | Credit | |\n|---|---|---|---|\n| **Payments (squeeze)** | **2,520,000** | Beginning | 280,000 |\n| Ending | 230,000 | Purchases | 2,470,000 |\n| **Total** | **2,750,000** | **Total** | **2,750,000** |\n\nShortcut: COGS 2,400,000 + increase in inventory 70,000 + decrease in AP 50,000 = **₱2,520,000**.", "subtopic": "Cash paid to suppliers", "difficulty": "easy", "approach": "Two steps: Inventory T-account gives purchases, AP T-account gives payments.", "trap": "Skipping the inventory step and using COGS as purchases."}, {"no": 6, "title": "Cash paid to suppliers (complex)", "problem": "Entity D provided the following for 20x2. All purchases are recorded net of returns and discounts.\n\n| Particulars | Amount |\n|---|---|\n| Cost of goods sold (excludes the inventory write-down below) | 3,810,000 |\n| Loss on write-down of inventory to NRV (presented as other expense; inventory is carried net) | 40,000 |\n| Purchase returns | 60,000 |\n| Purchase discounts taken | 35,000 |\n| Inventory, net: Jan. 1 / Dec. 31 | 610,000 / 540,000 |\n| Accounts payable (trade): Jan. 1 / Dec. 31 | 420,000 / 505,000 |\n| Trade notes payable to suppliers: Jan. 1 / Dec. 31 | 100,000 / 60,000 |\n| Advances to suppliers: Jan. 1 / Dec. 31 | 50,000 / 80,000 |\n| Notes issued to suppliers to settle accounts payable | 150,000 |", "requirements": ["How much were the net purchases?", "How much is the cash paid to suppliers?"], "answer": "(a) ₱3,780,000\n(b) ₱3,765,000", "solution": "**Inventory, net**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning | 610,000 | Cost of goods sold | 3,810,000 |\n| **Net purchases (squeeze)** | **3,780,000** | Write-down to NRV | 40,000 |\n|  |  | Ending | 540,000 |\n| **Total** | **4,390,000** | **Total** | **4,390,000** |\n\nReturns and discounts are already netted in purchases, so do not deduct them again. Notes issued to settle AP move a balance from AP to NP, with no cash. Treat AP and trade NP together as \"trade payables\" (Jan. 1 ₱520,000; Dec. 31 ₱565,000).\n\nLet Y = purchases settled by applying advances. Cash paid on trade payables = 520,000 + (3,780,000 − Y) − 565,000. Cash paid as advances = 80,000 + Y − 50,000. Adding the two, Y cancels out:\n\n| Particulars | Amount |\n|---|---|\n| Net purchases | 3,780,000 |\n| Less: increase in trade payables (565,000 − 520,000) | (45,000) |\n| Add: increase in advances to suppliers (80,000 − 50,000) | 30,000 |\n| **Cash paid to suppliers** | **3,765,000** |", "subtopic": "Cash paid to suppliers", "difficulty": "difficult", "approach": "Purchases come from the inventory account (include write-downs taken out of inventory). Then adjust for the change in all trade payables and advances to suppliers.", "trap": "Deducting purchase returns and discounts again when purchases are already recorded net."}, {"no": 7, "title": "Cash paid for operating expenses", "problem": "Entity E reported total operating expenses of ₱1,250,000, made up of:\n\n| Particulars | Amount |\n|---|---|\n| Depreciation | 180,000 |\n| Doubtful accounts expense | 25,000 |\n| Salaries and wages | 420,000 |\n| Insurance | 60,000 |\n| Utilities, supplies and other expenses | 565,000 |\n| **Total** | **1,250,000** |\n\nRelated balances (Jan. 1 / Dec. 31):\n\n| Particulars | Amount |\n|---|---|\n| Salaries payable | 35,000 / 20,000 |\n| Prepaid insurance | 18,000 / 30,000 |\n| Accrued utilities | 12,000 / 22,000 |\n| Supplies on hand (prepaid other) | 8,000 / 5,000 |", "requirements": ["How much cash was paid to employees?", "How much cash was paid for insurance?", "How much is the total cash paid for operating expenses, including salaries?"], "answer": "(a) ₱435,000\n(b) ₱72,000\n(c) ₱1,059,000", "solution": "| Expense | Accrual amount | Adjustment | Cash paid |\n|---|---|---|---|\n| Salaries | 420,000 | + decrease in salaries payable 15,000 | 435,000 |\n| Insurance | 60,000 | + increase in prepaid 12,000 | 72,000 |\n| Utilities, supplies, other | 565,000 | − increase in accrued 10,000; − decrease in supplies 3,000 | 552,000 |\n| Depreciation and doubtful accounts | 205,000 | Non-cash: excluded | 0 |\n| **Total cash paid** |  |  | **1,059,000** |", "subtopic": "Cash paid for operating expenses", "difficulty": "average", "approach": "Take each expense to cash with its own prepaid or accrued account; drop non-cash expenses entirely.", "trap": "Including depreciation or doubtful accounts in cash paid."}, {"no": 8, "title": "Interest paid and interest received", "problem": "| Particulars | Amount |\n|---|---|\n| Interest expense (includes ₱22,000 amortization of discount on bonds payable) | 380,000 |\n| Interest payable: Jan. 1 / Dec. 31 | 45,000 / 60,000 |\n| Interest income (includes ₱6,000 amortization of premium on a bond investment at amortized cost; the amortization reduced interest income) | 95,000 |\n| Interest receivable: Jan. 1 / Dec. 31 | 20,000 / 12,000 |", "requirements": ["How much is the interest paid?", "How much is the interest received?", "Where are these presented under Option 1 and under Option 2?"], "answer": "(a) ₱343,000\n(b) ₱109,000", "solution": "**Interest payable**\n| Debit | | Credit | |\n|---|---|---|---|\n| **Interest paid (squeeze)** | **343,000** | Beginning | 45,000 |\n| Ending | 60,000 | Interest expense − discount amortization (380,000 − 22,000) | 358,000 |\n| **Total** | **403,000** | **Total** | **403,000** |\n\n**Interest receivable**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning | 20,000 | **Interest received (squeeze)** | **109,000** |\n| Nominal interest earned (95,000 + 6,000) | 101,000 | Ending | 12,000 |\n| **Total** | **121,000** | **Total** | **121,000** |\n\nWhy add premium amortization: the entry is Dr Cash (nominal) / Cr Interest income (effective) / Cr Investment (amortization). Cash received is larger than the income recognized. Discount amortization on bonds payable is the reverse: expense is larger than cash paid.\n\n(c) Option 1: both are operating. Option 2: interest received is investing and interest paid is financing.", "subtopic": "Interest and taxes", "difficulty": "average", "approach": "Interest payable T-account, after removing discount amortization from interest expense. For an investment bought at a premium, cash received is larger than interest income.", "trap": "Using interest expense as interest paid without taking out the discount amortization."}, {"no": 9, "title": "Income taxes paid", "problem": "| Particulars | Amount |\n|---|---|\n| Income tax expense (current and deferred) | 540,000 |\n| Income tax payable: Jan. 1 / Dec. 31 | 110,000 / 75,000 |\n| Deferred tax liability: Jan. 1 / Dec. 31 | 200,000 / 250,000 |\n| Deferred tax asset: Jan. 1 / Dec. 31 | 40,000 / 30,000 |", "requirements": ["How much is the current tax expense?", "How much are the income taxes paid?"], "answer": "(a) ₱480,000\n(b) ₱515,000", "solution": "Deferred tax expense = increase in DTL 50,000 + decrease in DTA 10,000 = 60,000. Current tax expense = 540,000 − 60,000 = **₱480,000**.\n\n**Income tax payable**\n| Debit | | Credit | |\n|---|---|---|---|\n| **Taxes paid (squeeze)** | **515,000** | Beginning | 110,000 |\n| Ending | 75,000 | Current tax expense | 480,000 |\n| **Total** | **590,000** | **Total** | **590,000** |", "subtopic": "Interest and taxes", "difficulty": "average", "approach": "Split tax expense into current and deferred using the changes in DTL and DTA, then run the current part through income tax payable.", "trap": "Running total tax expense, deferred part included, through income tax payable."}, {"no": 10, "title": "Dividends paid (retained earnings squeeze)", "problem": "| Particulars | Amount |\n|---|---|\n| Retained earnings: Jan. 1 / Dec. 31 | 2,400,000 / 2,950,000 |\n| Net income for 20x2 | 1,100,000 |\n| Small stock dividend declared and issued (at fair value) | 250,000 |\n| Correction of prior period error (understated depreciation), net of tax, debited to retained earnings | 80,000 |\n| Dividends payable: Jan. 1 / Dec. 31 | 60,000 / 90,000 |", "requirements": ["How much cash dividends were declared?", "How much cash dividends were paid, and where are they presented?"], "answer": "(a) ₱220,000\n(b) ₱190,000, financing", "solution": "**Retained earnings**\n| Debit | | Credit | |\n|---|---|---|---|\n| Prior period error | 80,000 | Beginning | 2,400,000 |\n| Stock dividend | 250,000 | Net income | 1,100,000 |\n| **Cash dividends declared (squeeze)** | **220,000** |  |  |\n| Ending | 2,950,000 |  |  |\n| **Total** | **3,500,000** | **Total** | **3,500,000** |\n\n**Dividends payable**\n| Debit | | Credit | |\n|---|---|---|---|\n| **Dividends paid (squeeze)** | **190,000** | Beginning | 60,000 |\n| Ending | 90,000 | Cash dividends declared | 220,000 |\n| **Total** | **280,000** | **Total** | **280,000** |\n\nDividends paid of ₱190,000 are a financing outflow under Option 1. The stock dividend and the error correction involve no cash.", "subtopic": "Dividends", "difficulty": "average", "approach": "Retained earnings T-account gives cash dividends declared; dividends payable T-account gives dividends paid.", "trap": "Treating stock dividends or error corrections as cash dividends."}, {"no": 11, "title": "Rent received and rent paid", "problem": "Entity F leases out part of its building and also rents a warehouse on short-term arrangements.\n\n| Particulars | Amount |\n|---|---|\n| Rent revenue | 480,000 |\n| Unearned rent: Jan. 1 / Dec. 31 | 60,000 / 90,000 |\n| Rent receivable: Jan. 1 / Dec. 31 | 25,000 / 10,000 |\n| Rent expense (short-term leases) | 240,000 |\n| Prepaid rent: Jan. 1 / Dec. 31 | 30,000 / 50,000 |\n| Accrued rent payable: Jan. 1 / Dec. 31 | 10,000 / 0 |", "requirements": ["How much cash was received from rent?", "How much cash was paid for rent?"], "answer": "(a) ₱525,000\n(b) ₱270,000", "solution": "| Particulars | Amount |\n|---|---|\n| Rent revenue | 480,000 |\n| Add: increase in unearned rent (90,000 − 60,000) | 30,000 |\n| Add: decrease in rent receivable (25,000 − 10,000) | 15,000 |\n| **Cash received from rent** | **525,000** |\n\n| Particulars | Amount |\n|---|---|\n| Rent expense | 240,000 |\n| Add: increase in prepaid rent (50,000 − 30,000) | 20,000 |\n| Add: decrease in accrued rent payable (10,000 − 0) | 10,000 |\n| **Cash paid for rent** | **270,000** |", "subtopic": "Other operating receipts and payments", "difficulty": "easy", "approach": "Revenue + increase in unearned − increase in receivable; expense + increase in prepaid + decrease in accrued.", "trap": "Getting the direction of unearned rent wrong: an increase means more cash came in than was earned."}, {"no": 12, "title": "Operating activities – direct method", "problem": "Entity G's 20x2 income statement:\n\n| Particulars | Amount |\n|---|---|\n| Sales | 6,000,000 |\n| Cost of goods sold | (3,600,000) |\n| **Gross profit** | **2,400,000** |\n| Salaries expense | (520,000) |\n| Depreciation | (250,000) |\n| Other operating expenses | (380,000) |\n| Interest expense | (90,000) |\n| Gain on sale of equipment | 40,000 |\n| **Profit before tax** | **1,200,000** |\n| Income tax expense | (360,000) |\n| **Net income** | **840,000** |\n\nChanges in balances during 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Accounts receivable | increased 150,000 |\n| Inventory | decreased 80,000 |\n| Prepaid other operating expenses | increased 10,000 |\n| Accounts payable (trade) | decreased 60,000 |\n| Salaries payable | increased 15,000 |\n| Accrued other operating expenses | decreased 5,000 |\n| Interest payable | increased 10,000 |\n| Income tax payable | decreased 20,000 |", "requirements": ["Compute each line of operating activities under the direct method: cash received from customers, cash paid to suppliers, cash paid to employees, cash paid for other operating expenses, cash generated from operations, interest paid, income taxes paid and net cash from operating activities.", "Prove your answer using the indirect method."], "answer": "Net cash from operating activities ₱910,000", "solution": "| Particulars | Amount |\n|---|---|\n| Cash received from customers (6,000,000 − 150,000) | 5,850,000 |\n| Cash paid to suppliers (3,600,000 − 80,000 + 60,000) | (3,580,000) |\n| Cash paid to employees (520,000 − 15,000) | (505,000) |\n| Cash paid for other operating expenses (380,000 + 10,000 + 5,000) | (395,000) |\n| **Cash generated from operations** | **1,370,000** |\n| Interest paid (90,000 − 10,000) | (80,000) |\n| Income taxes paid (360,000 + 20,000) | (380,000) |\n| **Net cash from operating activities** | **910,000** |\n\nDepreciation and the gain on sale are ignored in the direct method; the sale proceeds belong in investing activities.\n\nProof (indirect): 840,000 + 250,000 − 40,000 − 150,000 + 80,000 − 10,000 − 60,000 + 15,000 − 5,000 + 10,000 − 20,000 = **₱910,000**.", "subtopic": "Direct method", "difficulty": "average", "approach": "Convert each income-statement line to cash with its related working-capital account; ignore non-cash items and gains.", "trap": "Including the gain on sale of equipment in operating cash."}, {"no": 13, "title": "Operating activities – indirect method with tricky items", "problem": "Entity H reported net income of ₱1,500,000 for 20x2. The following were included in or relate to net income:\n\n| Particulars | Amount |\n|---|---|\n| Depreciation | 320,000 |\n| Amortization of patent | 40,000 |\n| Impairment loss on goodwill | 60,000 |\n| Loss on sale of equipment | 25,000 |\n| Gain on early retirement of bonds payable | 35,000 |\n| Share in profit of associate (equity method) | 180,000 |\n| Dividends received from associate | 70,000 |\n| Held-for-trading securities: Jan. 1 ₱400,000; Dec. 31 ₱630,000 (no sales; unrealized gain in profit ₱30,000) |  |\n| Amortization of discount on bonds payable | 15,000 |\n| Amortization of premium on bond investment (amortized cost) | 8,000 |\n| Accounts receivable (gross) increased by ₱120,000; allowance increased by ₱20,000 (bad debt expense ₱45,000; write-offs ₱25,000) |  |\n| Inventory decreased | 90,000 |\n| Prepaid expenses increased | 12,000 |\n| Accounts payable increased | 70,000 |\n| Accrued liabilities decreased | 18,000 |\n| Income tax payable increased | 25,000 |\n| Deferred tax liability increased | 30,000 |", "requirements": ["How much is the net cash from operating activities?", "Show that using gross receivables gives the same adjustment as using net receivables."], "answer": "₱1,678,000", "solution": "| Particulars | Amount |\n|---|---|\n| Net income | 1,500,000 |\n| Depreciation | 320,000 |\n| Amortization of patent | 40,000 |\n| Impairment loss on goodwill | 60,000 |\n| Loss on sale of equipment | 25,000 |\n| Gain on early retirement of bonds | (35,000) |\n| Share in profit of associate | (180,000) |\n| Dividends received from associate (operating, Option 1) | 70,000 |\n| Increase in HFT securities (purchases 200,000 + unrealized gain 30,000) | (230,000) |\n| Amortization of discount on bonds payable | 15,000 |\n| Amortization of premium on bond investment | 8,000 |\n| Increase in accounts receivable, net (120,000 − 20,000) | (100,000) |\n| Decrease in inventory | 90,000 |\n| Increase in prepaid expenses | (12,000) |\n| Increase in accounts payable | 70,000 |\n| Decrease in accrued liabilities | (18,000) |\n| Increase in income tax payable | 25,000 |\n| Increase in deferred tax liability | 30,000 |\n| **Net cash from operating activities** | **1,678,000** |\n\nTrap: deducting the ₱30,000 unrealized gain and also the ₱230,000 increase in HFT would double count. The increase in the HFT balance already contains the gain.\n\n(b) Gross approach: add bad debt expense 45,000, deduct the increase in gross AR 120,000, and deduct write-offs 25,000 (which reduced gross AR without cash) = (100,000). Same as the net approach.", "subtopic": "Indirect method", "difficulty": "difficult", "approach": "Start from net income, remove every non-cash item and every investing or financing gain or loss, then adjust for working capital.", "trap": "Deducting the unrealized gain AND the full increase in trading securities (double counting)."}, {"no": 14, "title": "Property, plant and equipment squeeze", "problem": "| Particulars | Amount |\n|---|---|\n| Equipment, at cost: Jan. 1 / Dec. 31 | 2,500,000 / 3,100,000 |\n| Accumulated depreciation: Jan. 1 / Dec. 31 | 900,000 / 1,050,000 |\n| Equipment purchased for cash | 800,000 |\n| Equipment acquired by issuing a 2-year note payable | 300,000 |\n| Depreciation expense | 280,000 |\n| Gain on sale of equipment | 30,000 |", "requirements": ["What was the cost of equipment sold?", "What was the accumulated depreciation on the equipment sold?", "How much cash was received from the sale?", "How much is the net cash used in investing activities (assume no other investing transactions)?", "How is the equipment acquired through the note reported?"], "answer": "(a) ₱500,000\n(b) ₱130,000\n(c) ₱400,000\n(d) ₱(400,000)", "solution": "**Equipment**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning | 2,500,000 | **Cost of equipment sold (squeeze)** | **500,000** |\n| Purchased for cash | 800,000 | Ending | 3,100,000 |\n| Acquired by note | 300,000 |  |  |\n| **Total** | **3,600,000** | **Total** | **3,600,000** |\n\n**Accumulated depreciation**\n| Debit | | Credit | |\n|---|---|---|---|\n| **On equipment sold (squeeze)** | **130,000** | Beginning | 900,000 |\n| Ending | 1,050,000 | Depreciation | 280,000 |\n| **Total** | **1,180,000** | **Total** | **1,180,000** |\n\nCarrying amount sold = 500,000 − 130,000 = 370,000. Proceeds = 370,000 + gain 30,000 = **₱400,000**. Net cash used in investing = 400,000 − 800,000 = **₱(400,000)**. The ₱300,000 note acquisition is a non-cash investing and financing transaction, disclosed only.", "subtopic": "Investing activities", "difficulty": "average", "approach": "Squeeze the cost of equipment sold from the Equipment T-account and its accumulated depreciation from the AD T-account
