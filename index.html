r Option 1).", "subtopic": "Investing activities", "difficulty": "average", "approach": "Squeeze FVOCI purchases from the investment T-account; sort each remaining item by section, leaving out non-cash ones.", "trap": "Putting interest collected in investing (it is operating under Option 1)."}, {"no": 16, "title": "Financing activities", "problem": "Entity J had these balances and transactions in 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Bonds payable (face): Jan. 1 ₱2,000,000; Dec. 31 ₱3,000,000. Discount on bonds payable: Jan. 1 ₱80,000; Dec. 31 ₱115,000. |  |\n| New bonds with face amount of ₱1,500,000 were issued at 97. Bonds with face amount of ₱500,000 and unamortized discount of ₱4,000 were retired at 102. |  |\n| Ordinary share capital (₱10 par): Jan. 1 ₱5,000,000; Dec. 31 ₱5,800,000. Share premium: Jan. 1 ₱1,200,000; Dec. 31 ₱1,560,000. |  |\n| Early in 20x2, a 6% stock dividend was issued when the fair value was ₱12 per share. The rest of the increase in share capital and share premium came from issuing shares for cash. |  |\n| Treasury shares bought for cash | 120,000 |\n| Half of the treasury shares (cost ₱60,000) were reissued for (excess credited to \"Share premium – treasury shares\") | 75,000 |\n| Lease payments: principal ₱90,000; interest ₱30,000 |  |\n| Cash dividends paid | 250,000 |\n| Short-term bank loan: proceeds ₱400,000; repayments ₱150,000 |  |", "requirements": ["How much cash was received from issuing bonds?", "How much cash was paid to retire bonds, and what was the gain or loss?", "How much discount was amortized in 20x2?", "How much cash was received from issuing shares?", "How much is the net cash from financing activities?"], "answer": "(a) ₱1,455,000\n(b) ₱510,000; loss ₱14,000\n(c) ₱6,000\n(d) ₱800,000\n(e) ₱1,610,000", "solution": "(a) Bond issue: 1,500,000 × 97% = **₱1,455,000** (discount 45,000).\n\n(b) Retirement: 500,000 × 102% = **₱510,000** cash. Carrying amount 500,000 − 4,000 = 496,000. Loss = **₱14,000**.\n\n**Discount on bonds payable**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning | 80,000 | Written off on retirement | 4,000 |\n| New issue | 45,000 | **Amortization (squeeze)** | **6,000** |\n|  |  | Ending | 115,000 |\n| **Total** | **125,000** | **Total** | **125,000** |\n\n(d) Shares outstanding before the stock dividend = 5,000,000 ÷ 10 = 500,000. Stock dividend = 30,000 shares × ₱12 = 360,000 (SC 300,000; SP 60,000). Cash issuance = SC (800,000 − 300,000) 500,000 + SP (360,000 − 60,000) 300,000 = **₱800,000**.\n\n| Particulars | Amount |\n|---|---|\n| Proceeds from bonds | 1,455,000 |\n| Retirement of bonds | (510,000) |\n| Proceeds from share issuance | 800,000 |\n| Purchase of treasury shares | (120,000) |\n| Reissuance of treasury shares | 75,000 |\n| Lease principal payments | (90,000) |\n| Dividends paid | (250,000) |\n| Proceeds from short-term bank loan | 400,000 |\n| Repayment of short-term bank loan | (150,000) |\n| **Net cash from financing activities** | **1,610,000** |\n\nLease interest of ₱30,000 is operating under Option 1. The stock dividend is non-cash.", "subtopic": "Financing activities", "difficulty": "difficult", "approach": "Separate each equity and debt account change into its cash and non-cash parts (stock dividends, discount amortization).", "trap": "Treating the whole increase in share capital as cash."}, {"no": 17, "title": "Comprehensive statement of cash flows", "problem": "Entity K's comparative statements of financial position:\n\n| Account | Dec. 31, 20x2 | Dec. 31, 20x1 |\n|---|---|---|\n| Cash | ? | 180,000 |\n| Accounts receivable, net | 500,000 | 420,000 |\n| Inventory | 550,000 | 600,000 |\n| Prepaid expenses | 50,000 | 40,000 |\n| Equipment | 2,400,000 | 2,000,000 |\n| Accumulated depreciation | (550,000) | (500,000) |\n| Land | 1,200,000 | 800,000 |\n| Accounts payable | 390,000 | 350,000 |\n| Accrued operating expenses | 45,000 | 60,000 |\n| Income tax payable | 60,000 | 50,000 |\n| Bonds payable | 1,000,000 | 800,000 |\n| Share capital | 1,700,000 | 1,500,000 |\n| Share premium | 300,000 | 200,000 |\n| Retained earnings | 980,000 | 580,000 |\n\nIncome statement for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Sales | 4,800,000 |\n| Cost of goods sold | (2,900,000) |\n| Operating expenses (excluding depreciation) | (650,000) |\n| Depreciation | (230,000) |\n| Loss on sale of equipment | (20,000) |\n| Interest expense (all paid in cash) | (80,000) |\n| Income tax expense | (270,000) |\n| **Net income** | **650,000** |\n\nAdditional information: equipment was sold for ₱100,000 cash; land was acquired by issuing bonds of ₱400,000; some bonds were retired at face value for cash; shares were issued for cash; the only change in retained earnings other than net income was cash dividends declared and paid. There are no bad debts.", "requirements": ["Net cash from operating activities using the indirect method.", "Net cash from operating activities using the direct method (show each line).", "Cost of equipment purchased for cash and net cash used in investing activities.", "Net cash from (used in) financing activities.", "Cash balance on December 31, 20x2.", "Non-cash transactions to be disclosed."], "answer": "CFO ₱895,000; CFI ₱(600,000); CFF ₱(150,000); ending cash ₱325,000", "solution": "### (a) Indirect method\n\n| Particulars | Amount |\n|---|---|\n| Net income | 650,000 |\n| Depreciation | 230,000 |\n| Loss on sale of equipment | 20,000 |\n| Increase in accounts receivable | (80,000) |\n| Decrease in inventory | 50,000 |\n| Increase in prepaid expenses | (10,000) |\n| Increase in accounts payable | 40,000 |\n| Decrease in accrued operating expenses | (15,000) |\n| Increase in income tax payable | 10,000 |\n| **Net cash from operating activities** | **895,000** |\n\n### (b) Direct method\n\n| Particulars | Amount |\n|---|---|\n| Cash received from customers (4,800,000 − 80,000) | 4,720,000 |\n| Cash paid to suppliers (2,900,000 − 50,000 − 40,000) | (2,810,000) |\n| Cash paid for operating expenses (650,000 + 10,000 + 15,000) | (675,000) |\n| **Cash generated from operations** | **1,235,000** |\n| Interest paid | (80,000) |\n| Income taxes paid (270,000 − 10,000) | (260,000) |\n| **Net cash from operating activities** | **895,000** |\n\n### (c) Investing\n\n**Accumulated depreciation**\n| Debit | | Credit | |\n|---|---|---|---|\n| **On equipment sold (squeeze)** | **180,000** | Beginning | 500,000 |\n| Ending | 550,000 | Depreciation | 230,000 |\n| **Total** | **730,000** | **Total** | **730,000** |\n\nCarrying amount sold = proceeds 100,000 + loss 20,000 = 120,000; cost sold = 120,000 + 180,000 = 300,000.\n\n**Equipment**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning | 2,000,000 | Cost of equipment sold | 300,000 |\n| **Purchases (squeeze)** | **700,000** | Ending | 2,400,000 |\n| **Total** | **2,700,000** | **Total** | **2,700,000** |\n\nNet cash used in investing = −700,000 + 100,000 = **₱(600,000)**. Land increased ₱400,000 entirely through bonds, so no cash.\n\n### (d) Financing\n\n**Bonds payable**\n| Debit | | Credit | |\n|---|---|---|---|\n| **Retired for cash (squeeze)** | **200,000** | Beginning | 800,000 |\n| Ending | 1,000,000 | Issued for land | 400,000 |\n| **Total** | **1,200,000** | **Total** | **1,200,000** |\n\nShares issued for cash = (1,700,000 − 1,500,000) + (300,000 − 200,000) = 300,000. Dividends paid = 580,000 + 650,000 − 980,000 = 250,000. Net cash used in financing = −200,000 + 300,000 − 250,000 = **₱(150,000)**.\n\n### (e) and (f)\n\nNet increase = 895,000 − 600,000 − 150,000 = 145,000. Ending cash = 180,000 + 145,000 = **₱325,000**. Non-cash disclosure: acquisition of land by issuing bonds payable, ₱400,000.", "subtopic": "Comprehensive statement", "difficulty": "difficult", "approach": "Indirect: net income ± non-cash items ± working capital. Then squeeze PPE, bonds and dividends. Finish with beginning cash + net change.", "trap": "Missing that the land was acquired by issuing bonds (non-cash)."}, {"no": 18, "title": "Working backwards (find net income and beginning cash)", "problem": "| Particulars | Amount |\n|---|---|\n| Net cash from operating activities | 1,240,000 |\n| Depreciation | 210,000 |\n| Gain on sale of equipment | 35,000 |\n| Accounts receivable increased | 90,000 |\n| Inventory decreased | 60,000 |\n| Accounts payable decreased | 45,000 |\n| Accrued expenses increased | 20,000 |\n| Net cash used in investing activities | (680,000) |\n| Net cash from financing activities | 150,000 |\n| Effect of exchange rate changes on cash held in US dollars (increase) | 15,000 |\n| Cash and cash equivalents, Dec. 31, 20x2 | 980,000 |", "requirements": ["What was the net income?", "What was the cash and cash equivalents on January 1, 20x2?"], "answer": "(a) ₱1,120,000\n(b) ₱255,000", "solution": "Reverse the indirect method: NI = CFO − depreciation + gain + increase in AR − decrease in inventory + decrease in AP − increase in accrued expenses.\n\nNI = 1,240,000 − 210,000 + 35,000 + 90,000 − 60,000 + 45,000 − 20,000 = **₱1,120,000**.\n\nNet change in cash = 1,240,000 − 680,000 + 150,000 + 15,000 (FX effect) = 725,000. Beginning cash = 980,000 − 725,000 = **₱255,000**. The FX effect is not a cash flow, but it is part of the reconciliation of beginning and ending cash (PAS 7.28).", "subtopic": "Working backwards", "difficulty": "average", "approach": "Reverse every indirect-method adjustment to get net income, then subtract the net change (including the FX effect) from ending cash.", "trap": "Leaving out the foreign exchange effect when computing beginning cash."}, {"no": 19, "title": "Reverse squeeze (find sales and cost of goods sold from cash data)", "problem": "| Particulars | Amount |\n|---|---|\n| Cash collected on accounts receivable | 3,800,000 |\n| Accounts receivable: Jan. 1 / Dec. 31 | 500,000 / 620,000 |\n| Accounts written off | 30,000 |\n| Sales returns (on account) | 40,000 |\n| Cash paid to suppliers | 2,100,000 |\n| Accounts payable: Jan. 1 / Dec. 31 | 260,000 / 310,000 |\n| Inventory: Jan. 1 / Dec. 31 | 400,000 / 360,000 |", "requirements": ["How much were the gross credit sales?", "How much were the purchases?", "How much is the cost of goods sold?"], "answer": "(a) ₱3,990,000\n(b) ₱2,150,000\n(c) ₱2,190,000", "solution": "**Accounts receivable**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning | 500,000 | Collections | 3,800,000 |\n| **Credit sales (squeeze)** | **3,990,000** | Write-offs | 30,000 |\n|  |  | Sales returns | 40,000 |\n|  |  | Ending | 620,000 |\n| **Total** | **4,490,000** | **Total** | **4,490,000** |\n\n**Accounts payable**\n| Debit | | Credit | |\n|---|---|---|---|\n| Payments | 2,100,000 | Beginning | 260,000 |\n| Ending | 310,000 | **Purchases (squeeze)** | **2,150,000** |\n| **Total** | **2,410,000** | **Total** | **2,410,000** |\n\n**Inventory**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning | 400,000 | **Cost of goods sold (squeeze)** | **2,190,000** |\n| Purchases | 2,150,000 | Ending | 360,000 |\n| **Total** | **2,550,000** | **Total** | **2,550,000** |", "subtopic": "Working backwards", "difficulty": "average", "approach": "Run the T-accounts the other way: collections give credit sales, payments give purchases, purchases give COGS.", "trap": "Forgetting to add write-offs and returns back when squeezing credit sales."}, {"no": 20, "title": "Option 1 vs Option 2", "problem": "| Particulars | Amount |\n|---|---|\n| Cash generated from operations (before interest, dividends and taxes) | 2,000,000 |\n| Interest received | 60,000 |\n| Dividends received | 40,000 |\n| Interest paid | 150,000 |\n| Dividends paid | 300,000 |\n| Income taxes paid | 420,000 |\n| Purchase of PPE | 900,000 |\n| Proceeds from long-term loan | 500,000 |", "requirements": ["Compute net cash from operating, investing and financing activities under Option 1.", "Compute the same under Option 2.", "Which option must a bank use?"], "answer": "Option 1: 1,530,000 / (900,000) / 200,000; Option 2: 1,280,000 / (800,000) / 350,000", "solution": "| Activity | Option 1 | Option 2 |\n|---|---|---|\n| Operating | 2,000,000 + 60,000 + 40,000 − 150,000 − 420,000 = 1,530,000 | 2,000,000 − 420,000 − 300,000 = 1,280,000 |\n| Investing | (900,000) | −900,000 + 60,000 + 40,000 = (800,000) |\n| Financing | 500,000 − 300,000 = 200,000 | 500,000 − 150,000 = 350,000 |\n| **Net increase** | **830,000** | **830,000** |\n\nThe net increase is the same under both options; only the classification changes. A bank (financial institution) may use only Option 1 (book p. 175).", "subtopic": "Interest and dividends: Option 1 vs Option 2", "difficulty": "average", "approach": "Option 1: interest and dividends received and interest paid are operating, dividends paid are financing. Option 2 moves each one to the section it relates to.", "trap": "Thinking the net change in cash differs between options. It never does."}, {"no": 21, "title": "Investment in associate", "problem": "| Particulars | Amount |\n|---|---|\n| Investment in associate: Jan. 1 / Dec. 31 | 1,800,000 / 1,950,000 |\n| Share in profit of associate | 300,000 |\n| Share in other comprehensive income of associate | 20,000 |\n| Additional shares of the associate bought for cash (no change in significant influence) | 100,000 |", "requirements": ["How much dividends were received from the associate?", "How is each cash flow classified under Option 1?", "What is the net adjustment to net income under the indirect method for the associate?"], "answer": "(a) ₱270,000\n(c) net deduction ₱30,000", "solution": "**Investment in associate**\n| Debit | | Credit | |\n|---|---|---|---|\n| Beginning | 1,800,000 | **Dividends received (squeeze)** | **270,000** |\n| Share in profit | 300,000 | Ending | 1,950,000 |\n| Share in OCI | 20,000 |  |  |\n| Additional purchase | 100,000 |  |  |\n| **Total** | **2,220,000** | **Total** | **2,220,000** |\n\n(b) Dividends received ₱270,000: operating (Option 1). Purchase of additional shares ₱100,000: investing. Share in profit and OCI: non-cash.\n\n(c) Deduct share in profit 300,000 and add dividends received 270,000: net deduction of **₱30,000**.", "subtopic": "Investments in associates", "difficulty": "average", "approach": "Investment T-account: beginning + share in profit + share in OCI + purchases − dividends = ending.", "trap": "Treating the share in profit as cash."}, {"no": 22, "title": "Leases (PFRS 16) in the statement of cash flows", "problem": "On January 1, 20x2, Entity L (lessee) recognized a right-of-use asset and lease liability of ₱1,000,000. The lease runs for 5 years with annual payments of ₱250,000 every December 31 and an implicit rate of 8%. The ROU asset is depreciated straight-line over 5 years. Entity L also paid ₱36,000 for short-term leases it chose not to capitalize.", "requirements": ["How much is reported in operating activities?", "How much is reported in financing activities?", "What non-cash transaction is disclosed?", "What indirect-method adjustment relates to the ROU asset?"], "answer": "CFO ₱(116,000); CFF ₱(170,000); non-cash ₱1,000,000", "solution": "Interest = 1,000,000 × 8% = 80,000. Principal = 250,000 − 80,000 = 170,000.\n\n| Particulars | Amount |\n|---|---|\n| Operating: interest paid on lease (Option 1) | (80,000) |\n| Operating: short-term lease payments | (36,000) |\n| **Total in operating activities** | **(116,000)** |\n| **Financing: principal portion of lease payments** | **(170,000)** |\n| **Non-cash disclosure: ROU asset acquired through lease liability** | **1,000,000** |\n\n(d) Add back ROU depreciation of ₱200,000 (1,000,000 ÷ 5). If starting from profit before tax, also add back interest expense of ₱80,000 and show interest paid of ₱80,000 separately.", "subtopic": "Leases", "difficulty": "average", "approach": "Split the payment into interest (operating, Option 1) and principal (financing); the initial recognition is non-cash.", "trap": "Reporting the ₱1,000,000 ROU asset as an investing outflow."}, {"no": 23, "title": "Compute net investing and net financing cash flows from a list", "problem": "| # | Transaction | Amount |\n|---|---|---|\n| 1 | Proceeds from reissuance of treasury shares | 150,000 |\n| 2 | Equipment costing ₱1,000,000 acquired by paying 20% down; a note was issued for the balance | 1,000,000 |\n| 3 | Payment of principal on the note in item 2 | 200,000 |\n| 4 | Cash dividends paid | 300,000 |\n| 5 | Dividends declared, unpaid at year-end | 100,000 |\n| 6 | Proceeds from sale of land | 500,000 |\n| 7 | Purchase of held-for-trading securities | 80,000 |\n| 8 | Purchase of bonds of another entity (amortized cost) | 400,000 |\n| 9 | Purchase of a 2-month treasury bill | 120,000 |\n| 10 | Collection of a loan made to an affiliate | 250,000 |\n| 11 | Interest received on the loan in item 10 | 20,000 |\n| 12 | Repayment of bank loan principal | 600,000 |\n| 13 | Interest paid on the bank loan | 45,000 |\n| 14 | Conversion of bonds payable into ordinary shares | 1,000,000 |\n| 15 | Acquisition of a subsidiary (control obtained): cash paid ₱700,000; cash of subsidiary acquired ₱50,000 |  |\n| 16 | Purchase of additional shares in a subsidiary already controlled | 300,000 |", "requirements": ["How much is the net cash from (used in) investing activities?", "How much is the net cash from (used in) financing activities?", "Which items affect operating activities, and by how much in total?"], "answer": "(a) ₱(500,000)\n(b) ₱(1,250,000)\n(c) ₱(105,000)", "solution": "| # | Classification | Investing | Financing |\n|---|---|---|---|\n| 1 | F |  | 150,000 |\n| 2 | I (down payment only); note is non-cash | (200,000) |  |\n| 3 | F (repayment of seller financing) |  | (200,000) |\n| 4 | F |  | (300,000) |\n| 5 | None (unpaid) |  |  |\n| 6 | I | 500,000 |  |\n| 7 | O |  |  |\n| 8 | I | (400,000) |  |\n| 9 | X (cash equivalent) |  |  |\n| 10 | I | 250,000 |  |\n| 11 | O |  |  |\n| 12 | F |  | (600,000) |\n| 13 | O |  |  |\n| 14 | N |  |  |\n| 15 | I, net of cash acquired (700,000 − 50,000) | (650,000) |  |\n| 16 | F (no change in control) |  | (300,000) |\n|  | **Total** | **(500,000)** | **(1,250,000)** |\n\n(c) Operating: −80,000 (HFT) + 20,000 (interest received) − 45,000 (interest paid) = **₱(105,000)**.", "subtopic": "Investing vs financing", "difficulty": "average", "approach": "Sort each transaction, then total each section. Exclude non-cash items and movements between cash and cash equivalents.", "trap": "Classifying a purchase of additional shares in an existing subsidiary as investing (it is financing)."}, {"no": 24, "title": "Indirect method in the book's format (starting from profit before tax)", "problem": "Entity M presents its statement of cash flows starting from profit before tax, as illustrated in the book. Data for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Profit before tax | 2,150,000 |\n| Depreciation | 400,000 |\n| Interest expense | 120,000 |\n| Interest income | 30,000 |\n| Dividend income | 15,000 |\n| Gain on sale of investment property | 60,000 |\n| Impairment loss on PPE | 45,000 |\n| Unrealized loss on held-for-trading securities (no purchases or sales) | 12,000 |\n| Accounts receivable, net – increase | 140,000 |\n| Inventory – increase | 90,000 |\n| Prepaid expenses – decrease | 8,000 |\n| Accounts payable – increase | 75,000 |\n| Accrued operating expenses – increase | 22,000 |\n| Unearned revenue – decrease | 18,000 |\n| Interest paid | 110,000 |\n| Interest received | 28,000 |\n| Dividends received | 15,000 |\n| Income taxes paid | 560,000 |", "requirements": ["How much is the cash generated from operations (after working capital changes, before interest, dividends and taxes)?", "How much is the net cash from operating activities?"], "answer": "(a) ₱2,479,000\n(b) ₱1,852,000", "solution": "| Particulars | Amount |\n|---|---|\n| Profit before tax | 2,150,000 |\n| Depreciation | 400,000 |\n| Interest expense | 120,000 |\n| Interest income | (30,000) |\n| Dividend income | (15,000) |\n| Gain on sale of investment property | (60,000) |\n| Impairment loss on PPE | 45,000 |\n| Unrealized loss on HFT securities | 12,000 |\n| **Subtotal** | **2,622,000** |\n| Increase in accounts receivable | (140,000) |\n| Increase in inventory | (90,000) |\n| Decrease in prepaid expenses | 8,000 |\n| Increase in accounts payable | 75,000 |\n| Increase in accrued operating expenses | 22,000 |\n| Decrease in unearned revenue | (18,000) |\n| **Cash generated from operations** | **2,479,000** |\n| Interest received | 28,000 |\n| Dividends received | 15,000 |\n| Interest paid | (110,000) |\n| Income taxes paid | (560,000) |\n| **Net cash from operating activities** | **1,852,000** |\n\nWhy remove interest and dividend income and add back interest expense: in this format, actual cash interest and dividends are shown as separate lines, so the accrual amounts are taken out of profit first to avoid double counting.", "subtopic": "Indirect method", "difficulty": "difficult", "approach": "In the book format, add back interest expense and deduct interest and dividend income first, then show the actual cash interest and dividends as separate lines.", "trap": "Adding back interest expense and still deducting interest paid as an adjustment in the working-capital section."}, {"no": 25, "title": "True or false (concepts)", "problem": "| # | Statement |\n|---|---|\n| 1 | A 1-year treasury bill purchased two months before its maturity is a cash equivalent. |\n| 2 | A 6-month time deposit acquired four months ago, with two months left to maturity, is a cash equivalent. |\n| 3 | Under the indirect method, a gain on sale of equipment is added to profit. |\n| 4 | Cash dividends declared but unpaid at year-end are reported as a financing outflow in that year. |\n| 5 | PAS 7 encourages, but does not require, the direct method. |\n| 6 | The choice between the direct and indirect method applies to operating, investing and financing activities. |\n| 7 | The effect of exchange rate changes on foreign currency cash is presented separately from the three activities. |\n| 8 | A bank overdraft repayable on demand that forms an integral part of cash management is included in cash and cash equivalents. |\n| 9 | A bank may classify interest paid as a financing activity. |\n| 10 | An increase in prepaid expenses is deducted from profit under the indirect method. |\n| 11 | Cash paid to acquire a subsidiary is an investing activity. |\n| 12 | Purchase of treasury shares is an investing activity. |", "requirements": [], "answer": "T, F, F, F, T, F, T, T, F, T, T, F", "solution": "| # | Answer | Reason |\n|---|---|---|\n| 1 | True | Acquired within 3 months of maturity |\n| 2 | False | Original maturity when acquired was 6 months |\n| 3 | False | Gains are deducted |\n| 4 | False | Only dividends actually paid are reported |\n| 5 | True | Book p. 176 |\n| 6 | False | Applies to operating activities only |\n| 7 | True | Shown as a reconciling item (PAS 7.28) |\n| 8 | True | Book p. 173 |\n| 9 | False | Financial institutions use Option 1 only |\n| 10 | True | More cash was used than expensed |\n| 11 | True | Obtaining control is investing |\n| 12 | False | Transactions with owners are financing |", "subtopic": "Concepts", "difficulty": "easy", "approach": "Use the definitions: 3-month rule, only actual cash flows, and the method choice applies to operating activities only.", "trap": "Assuming the direct/indirect choice applies to all three sections."}]}, {"topic": "PAS 7", "title": "PAS 7 Set 2: Build it from the financial statements", "source": "Built on Millan, CFAS (2020), pp. 170–183", "instructions": "Every problem gives you financial statements; your job is to build the statement of cash flows from them. Unless stated otherwise: the entity is non-financial, uses Option 1 for interest and dividends, and all amounts are in Philippine pesos. Where a cash figure shows \"?\", that is one of the things you need to find.", "problems": [{"no": 1, "title": "Find the ending cash (merchandiser)", "subtopic": "Comprehensive: find ending cash", "difficulty": "average", "problem": "Entity A, a trading company, presents the following:\n\n| Statement of financial position | Dec. 31, 20x2 | Dec. 31, 20x1 |\n|---|---|---|\n| **ASSETS** |  |  |\n| Cash | ? | 250,000 |\n| Accounts receivable | 470,000 | 380,000 |\n| Inventory | 560,000 | 520,000 |\n| Prepaid expenses | 25,000 | 30,000 |\n| Equipment | 2,200,000 | 1,800,000 |\n| Accumulated depreciation | (720,000) | (540,000) |\n| **Total assets** | **?** | **2,440,000** |\n| **LIABILITIES AND EQUITY** |  |  |\n| Accounts payable | 340,000 | 310,000 |\n| Accrued expenses | 60,000 | 45,000 |\n| Income tax payable | 54,000 | 40,000 |\n| Note payable – bank (long-term) | 400,000 | 600,000 |\n| Share capital | 1,200,000 | 1,000,000 |\n| Retained earnings | 701,000 | 445,000 |\n| **Total liabilities and equity** | **?** | **2,440,000** |\n\nStatement of profit or loss for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Sales (all on account) | 4,200,000 |\n| Cost of goods sold | (2,520,000) |\n| Operating expenses (excluding depreciation) | (880,000) |\n| Depreciation | (180,000) |\n| Interest expense (paid in cash) | (40,000) |\n| Income tax expense | (174,000) |\n| **Profit for the year** | **406,000** |\n\nAdditional information: no equipment was sold; shares were issued for cash; the only other change in retained earnings was cash dividends.", "requirements": ["Net cash from operating activities (indirect method).", "Each line of operating activities under the direct method.", "Net cash from (used in) investing and financing activities.", "How much is the cash on December 31, 20x2?"], "answer": "(a) ₱520,000\n(b) customers ₱4,110,000; suppliers ₱2,530,000; operating expenses ₱860,000; interest ₱40,000; taxes ₱160,000\n(c) investing ₱(400,000); financing ₱(150,000)\n(d) ₱220,000", "approach": "Work through the balance sheet changes line by line: operating assets and liabilities go to operating, PPE to investing, debt and equity to financing. Squeeze dividends out of retained earnings. Ending cash is beginning cash plus the net change.", "solution": "### (a) Indirect method\n\n| Particulars | Amount |\n|---|---|\n| Profit for the year | 406,000 |\n| Depreciation | 180,000 |\n| Increase in accounts receivable (470,000 − 380,000) | (90,000) |\n| Increase in inventory (560,000 − 520,000) | (40,000) |\n| Decrease in prepaid expenses | 5,000 |\n| Increase in accounts payable | 30,000 |\n| Increase in accrued expenses | 15,000 |\n| Increase in income tax payable | 14,000 |\n| **Net cash from operating activities** | **520,000** |\n\n### (b) Direct method\n\n| Particulars | Amount |\n|---|---|\n| Cash received from customers (4,200,000 − 90,000) | 4,110,000 |\n| Cash paid to suppliers (2,520,000 + 40,000 − 30,000) | (2,530,000) |\n| Cash paid for operating expenses (880,000 − 5,000 − 15,000) | (860,000) |\n| **Cash generated from operations** | **720,000** |\n| Interest paid | (40,000) |\n| Income taxes paid (174,000 − 14,000) | (160,000) |\n| **Net cash from operating activities** | **520,000** |\n\n### (c) Investing and financing\n\n**Retained earnings**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| **Cash dividends (squeeze)** | **150,000** | Beginning | 445,000 |\n| Ending | 701,000 | Profit | 406,000 |\n| **Total** | **851,000** | **Total** | **851,000** |\n\n| Particulars | Amount |\n|---|---|\n| Purchase of equipment (2,200,000 − 1,800,000; none sold) | (400,000) |\n| **Net cash used in investing activities** | **(400,000)** |\n| Repayment of bank note (600,000 − 400,000) | (200,000) |\n| Proceeds from issuing shares (1,200,000 − 1,000,000) | 200,000 |\n| Dividends paid | (150,000) |\n| **Net cash used in financing activities** | **(150,000)** |\n\n### (d) Ending cash\n\nNet decrease = 520,000 − 400,000 − 150,000 = (30,000). Cash, December 31, 20x2 = 250,000 − 30,000 = **₱220,000**.\n\nCheck: total assets 2,755,000 = total liabilities and equity 2,755,000.", "trap": "Forgetting that dividends must be squeezed from retained earnings when they are not given."}, {"no": 2, "title": "Find the beginning cash (equipment sale, allowance, non-cash issuance)", "subtopic": "Comprehensive: find beginning cash", "difficulty": "average", "problem": "Entity B presents the following:\n\n| Statement of financial position | Dec. 31, 20x2 | Dec. 31, 20x1 |\n|---|---|---|\n| **ASSETS** |  |  |\n| Cash | 261,000 | ? |\n| Accounts receivable | 675,000 | 600,000 |\n| Allowance for doubtful accounts | (55,000) | (40,000) |\n| Inventory | 780,000 | 750,000 |\n| Land | 1,500,000 | 900,000 |\n| Equipment | 3,400,000 | 3,000,000 |\n| Accumulated depreciation | (1,040,000) | (1,100,000) |\n| **Total assets** | **5,521,000** | **?** |\n| **LIABILITIES AND EQUITY** |  |  |\n| Accounts payable | 550,000 | 480,000 |\n| Accrued operating expenses | 50,000 | 70,000 |\n| Income tax payable | 70,000 | 60,000 |\n| Dividends payable | 50,000 | – |\n| Share capital | 2,900,000 | 2,500,000 |\n| Share premium | 500,000 | 300,000 |\n| Retained earnings | 1,401,000 | 1,020,000 |\n| **Total liabilities and equity** | **5,521,000** | **?** |\n\nStatement of profit or loss for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Sales (all on account) | 6,500,000 |\n| Cost of goods sold | (3,900,000) |\n| Operating expenses (excluding depreciation and bad debts) | (1,300,000) |\n| Bad debt expense | (50,000) |\n| Depreciation | (320,000) |\n| Gain on sale of equipment | 30,000 |\n| Income tax expense | (279,000) |\n| **Profit for the year** | **681,000** |\n\nAdditional information: equipment was purchased for ₱900,000 cash, and some old equipment was sold. The only shares issued during the year were issued in exchange for land. Cash dividends were declared during the year.", "requirements": ["Cost and accumulated depreciation of the equipment sold, and the cash proceeds.", "Net cash from operating activities (indirect method), using net receivables.", "Cash received from customers and cash paid to suppliers.", "Net cash used in investing activities and in financing activities.", "How much was the cash on January 1, 20x2?", "What non-cash transaction should be disclosed?"], "answer": "(a) cost ₱500,000; accumulated depreciation ₱380,000; proceeds ₱150,000\n(b) ₱941,000\n(c) ₱6,390,000 and ₱3,860,000\n(d) ₱(750,000) and ₱(250,000)\n(e) ₱320,000\n(f) land for shares, ₱600,000", "approach": "Squeeze the equipment sold from the Equipment and Accumulated depreciation T-accounts first, then build the statement. Beginning cash = ending cash − net change.", "solution": "### (a) Equipment sold\n\n**Equipment**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| Beginning | 3,000,000 | **Cost of equipment sold (squeeze)** | **500,000** |\n| Purchased for cash | 900,000 | Ending | 3,400,000 |\n| **Total** | **3,900,000** | **Total** | **3,900,000** |\n\n**Accumulated depreciation**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| **On equipment sold (squeeze)** | **380,000** | Beginning | 1,100,000 |\n| Ending | 1,040,000 | Depreciation | 320,000 |\n| **Total** | **1,420,000** | **Total** | **1,420,000** |\n\nCarrying amount = 500,000 − 380,000 = 120,000. Proceeds = 120,000 + gain 30,000 = **₱150,000**.\n\n### (b) Indirect method\n\n| Particulars | Amount |\n|---|---|\n| Profit for the year | 681,000 |\n| Depreciation | 320,000 |\n| Gain on sale of equipment | (30,000) |\n| Increase in accounts receivable, net (620,000 − 560,000) | (60,000) |\n| Increase in inventory | (30,000) |\n| Increase in accounts payable | 70,000 |\n| Decrease in accrued operating expenses | (20,000) |\n| Increase in income tax payable | 10,000 |\n| **Net cash from operating activities** | **941,000** |\n\nUsing net receivables, bad debt expense is not added back: the ₱60,000 increase in net receivables already reflects it.\n\n### (c) Customers and suppliers\n\nCash received from customers = sales 6,500,000 − bad debt expense 50,000 − increase in net AR 60,000 = **₱6,390,000**.\n\nCash paid to suppliers = COGS 3,900,000 + increase in inventory 30,000 − increase in AP 70,000 = **₱3,860,000**.\n\n### (d) Investing and financing\n\n**Retained earnings**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| **Dividends declared (squeeze)** | **300,000** | Beginning | 1,020,000 |\n| Ending | 1,401,000 | Profit | 681,000 |\n| **Total** | **1,701,000** | **Total** | **1,701,000** |\n\n**Dividends payable**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| **Dividends paid (squeeze)** | **250,000** | Beginning | 0 |\n| Ending | 50,000 | Declared | 300,000 |\n| **Total** | **300,000** | **Total** | **300,000** |\n\n| Particulars | Amount |\n|---|---|\n| Proceeds from sale of equipment | 150,000 |\n| Purchase of equipment | (900,000) |\n| **Net cash used in investing activities** | **(750,000)** |\n| Dividends paid | (250,000) |\n| **Net cash used in financing activities** | **(250,000)** |\n\n### (e) Beginning cash\n\nNet change = 941,000 − 750,000 − 250,000 = (59,000). Beginning cash = ending 261,000 + 59,000 = **₱320,000**.\n\n### (f) Non-cash transaction\n\nLand of ₱600,000 acquired by issuing shares (share capital +400,000, share premium +200,000). Disclose it; it is not in any section.", "trap": "Adding back bad debt expense while also using the change in NET receivables (double counting)."}, {"no": 3, "title": "Service company with a net loss", "subtopic": "Service company and net loss", "difficulty": "average", "problem": "Entity C provides consulting services. It is not subject to income tax for 20x2 because of the loss.\n\n| Statement of financial position | Dec. 31, 20x2 | Dec. 31, 20x1 |\n|---|---|---|\n| **ASSETS** |  |  |\n| Cash | 395,000 | 520,000 |\n| Fees receivable | 410,000 | 260,000 |\n| Prepaid rent | 30,000 | 60,000 |\n| Office supplies | 40,000 | 25,000 |\n| Office equipment | 1,150,000 | 900,000 |\n| Accumulated depreciation | (390,000) | (300,000) |\n| **Total assets** | **1,635,000** | **1,465,000** |\n| **LIABILITIES AND EQUITY** |  |  |\n| Accrued salaries | 55,000 | 40,000 |\n| Unearned service fees | 70,000 | 120,000 |\n| Accounts payable (supplies) | 50,000 | 55,000 |\n| Loan payable | 400,000 | – |\n| Share capital | 1,200,000 | 1,000,000 |\n| Retained earnings (deficit) | (140,000) | 250,000 |\n| **Total liabilities and equity** | **1,635,000** | **1,465,000** |\n\nStatement of profit or loss for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Service revenue | 2,400,000 |\n| Salaries expense | (1,900,000) |\n| Rent expense | (360,000) |\n| Supplies expense | (140,000) |\n| Utilities and other expenses (paid in cash) | (280,000) |\n| Depreciation | (90,000) |\n| Interest expense (paid in cash) | (20,000) |\n| **Net loss** | **(390,000)** |\n\nAdditional information: no equipment was disposed of; shares and the loan were issued for cash.", "requirements": ["Prepare the operating activities section using the direct method (cash received from clients, paid to employees, paid for rent, paid to suppliers of supplies, paid for utilities, interest paid).", "Reconcile using the indirect method.", "Net increase (decrease) in cash.", "Why is the operating cash outflow bigger than the net loss?"], "answer": "(a) clients ₱2,200,000; employees ₱(1,885,000); rent ₱(330,000); supplies ₱(160,000); utilities ₱(280,000); interest ₱(20,000); net ₱(475,000)\n(c) net decrease ₱(125,000); ending cash ₱395,000", "approach": "Convert each revenue and expense to cash using its related balance sheet account: receivable and unearned for revenue, accrued and prepaid for expenses. Supplies need two T-accounts (inventory, then payable).", "solution": "### (a) Direct method\n\n| Particulars | Amount |\n|---|---|\n| Cash received from clients (2,400,000 − 150,000 increase in fees receivable − 50,000 decrease in unearned fees) | 2,200,000 |\n| Cash paid to employees (1,900,000 − 15,000 increase in accrued salaries) | (1,885,000) |\n| Cash paid for rent (360,000 − 30,000 decrease in prepaid rent) | (330,000) |\n| Cash paid for supplies (see below) | (160,000) |\n| Cash paid for utilities and other expenses | (280,000) |\n| Interest paid | (20,000) |\n| **Net cash used in operating activities** | **(475,000)** |\n\n**Office supplies**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| Beginning | 25,000 | Supplies expense | 140,000 |\n| **Purchases (squeeze)** | **155,000** | Ending | 40,000 |\n| **Total** | **180,000** | **Total** | **180,000** |\n\n**Accounts payable (supplies)**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| **Payments (squeeze)** | **160,000** | Beginning | 55,000 |\n| Ending | 50,000 | Purchases | 155,000 |\n| **Total** | **210,000** | **Total** | **210,000** |\n\n### (b) Indirect method\n\n| Particulars | Amount |\n|---|---|\n| Net loss | (390,000) |\n| Depreciation | 90,000 |\n| Increase in fees receivable | (150,000) |\n| Decrease in prepaid rent | 30,000 |\n| Increase in office supplies | (15,000) |\n| Decrease in accounts payable | (5,000) |\n| Increase in accrued salaries | 15,000 |\n| Decrease in unearned service fees | (50,000) |\n| **Net cash used in operating activities** | **(475,000)** |\n\n### (c) Net change in cash\n\n| Particulars | Amount |\n|---|---|\n| Net cash used in operating activities | (475,000) |\n| Purchase of office equipment (1,150,000 − 900,000) | (250,000) |\n| Proceeds from loan | 400,000 |\n| Proceeds from issuing shares | 200,000 |\n| **Net decrease in cash** | **(125,000)** |\n| Cash, January 1 | 520,000 |\n| **Cash, December 31** | **395,000** |\n\n### (d) Why the outflow is bigger than the loss\n\nTwo things made cash worse than the loss: ₱150,000 of fees were earned but not yet collected, and ₱50,000 of revenue came from unearned fees that were collected in cash last year. Depreciation (non-cash) and the decrease in prepaid rent helped only partly.", "trap": "Treating the decrease in unearned revenue as cash received this year."}, {"no": 4, "title": "Bonds, deferred tax and held-for-trading securities (book format)", "subtopic": "Bonds, deferred tax and trading securities", "difficulty": "difficult", "problem": "Entity D presents its operating cash flows starting from profit before tax, as illustrated in the book.\n\n| Statement of financial position | Dec. 31, 20x2 | Dec. 31, 20x1 |\n|---|---|---|\n| **ASSETS** |  |  |\n| Cash | 1,027,000 | 400,000 |\n| Held-for-trading securities | 275,000 | 150,000 |\n| Accounts receivable | 820,000 | 700,000 |\n| Inventory | 860,000 | 900,000 |\n| Equipment | 5,800,000 | 5,000,000 |\n| Accumulated depreciation | (1,530,000) | (1,500,000) |\n| **Total assets** | **7,252,000** | **5,650,000** |\n| **LIABILITIES AND EQUITY** |  |  |\n| Accounts payable | 650,000 | 600,000 |\n| Interest payable | 45,000 | 30,000 |\n| Income tax payable | 70,000 | 80,000 |\n| Deferred tax liability | 150,000 | 120,000 |\n| Bonds payable | 3,000,000 | 2,000,000 |\n| Discount on bonds payable | (95,000) | (60,000) |\n| Share capital | 2,500,000 | 2,500,000 |\n| Retained earnings | 932,000 | 380,000 |\n| **Total liabilities and equity** | **7,252,000** | **5,650,000** |\n\nStatement of profit or loss for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Sales (all on account) | 8,000,000 |\n| Cost of goods sold | (4,800,000) |\n| Operating expenses (paid in cash) | (1,250,000) |\n| Depreciation | (450,000) |\n| Unrealized gain on held-for-trading securities | 25,000 |\n| Gain on sale of equipment | 50,000 |\n| Interest expense | (215,000) |\n| **Profit before tax** | **1,360,000** |\n| Income tax expense (current and deferred) | (408,000) |\n| **Profit for the year** | **952,000** |\n\nAdditional information: on December 31, 20x2, new bonds were issued at 95 (no interest yet accrued on them); no bonds were retired. Equipment was bought for ₱1,400,000 cash and some equipment was sold. There were no sales of trading securities. Cash dividends were paid.", "requirements": ["Discount amortization, interest paid and income taxes paid.", "Purchases of held-for-trading securities.", "Cash generated from operations and net cash from operating activities, in the book's format.", "Net cash from (used in) investing and financing activities.", "Cash on December 31, 20x2 (prove it agrees with the statement of financial position)."], "answer": "(a) amortization ₱15,000; interest paid ₱185,000; taxes paid ₱388,000\n(b) ₱100,000\n(c) cash generated ₱1,920,000; net ₱1,247,000\n(d) investing ₱(1,170,000); financing ₱550,000\n(e) ₱1,027,000", "approach": "In the book format start from profit before tax, add back interest expense, then show interest paid and taxes paid separately. Discount amortization makes interest expense larger than interest paid.", "solution": "### (a) Interest and taxes\n\n**Discount on bonds payable**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| Beginning | 60,000 | **Amortization (squeeze)** | **15,000** |\n| New issue (1,000,000 × 5%) | 50,000 | Ending | 95,000 |\n| **Total** | **110,000** | **Total** | **110,000** |\n\n**Interest payable**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| **Interest paid (squeeze)** | **185,000** | Beginning | 30,000 |\n| Ending | 45,000 | Interest expense − amortization (215,000 − 15,000) | 200,000 |\n| **Total** | **230,000** | **Total** | **230,000** |\n\nDeferred tax expense = increase in DTL (150,000 − 120,000) = 30,000, so current tax = 408,000 − 30,000 = 378,000.\n\n**Income tax payable**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| **Taxes paid (squeeze)** | **388,000** | Beginning | 80,000 |\n| Ending | 70,000 | Current tax expense | 378,000 |\n| **Total** | **458,000** | **Total** | **458,000** |\n\n### (b) Held-for-trading securities\n\n**Held-for-trading securities**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| Beginning | 150,000 | Ending | 275,000 |\n| **Purchases (squeeze)** | **100,000** |  |  |\n| Unrealized gain | 25,000 |  |  |\n| **Total** | **275,000** | **Total** | **275,000** |\n\n### (c) Operating activities (book format)\n\n| Particulars | Amount |\n|---|---|\n| Profit before tax | 1,360,000 |\n| Depreciation | 450,000 |\n| Unrealized gain on HFT securities | (25,000) |\n| Gain on sale of equipment | (50,000) |\n| Interest expense | 215,000 |\n| **Subtotal** | **1,950,000** |\n| Increase in accounts receivable | (120,000) |\n| Decrease in inventory | 40,000 |\n| Increase in accounts payable | 50,000 |\n| **Cash generated from operations** | **1,920,000** |\n| Interest paid | (185,000) |\n| Income taxes paid | (388,000) |\n| Cash paid for acquisition of HFT securities | (100,000) |\n| **Net cash from operating activities** | **1,247,000** |\n\n### (d) Investing and financing\n\n**Equipment**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| Beginning | 5,000,000 | **Cost of equipment sold (squeeze)** | **600,000** |\n| Purchased | 1,400,000 | Ending | 5,800,000 |\n| **Total** | **6,400,000** | **Total** | **6,400,000** |\n\n**Accumulated depreciation**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| **On equipment sold (squeeze)** | **420,000** | Beginning | 1,500,000 |\n| Ending | 1,530,000 | Depreciation | 450,000 |\n| **Total** | **1,950,000** | **Total** | **1,950,000** |\n\nProceeds = carrying amount (600,000 − 420,000) 180,000 + gain 50,000 = 230,000. Dividends = 380,000 + 952,000 − 932,000 = 400,000.\n\n| Particulars | Amount |\n|---|---|\n| Proceeds from sale of equipment | 230,000 |\n| Purchase of equipment | (1,400,000) |\n| **Net cash used in investing activities** | **(1,170,000)** |\n| Proceeds from issuing bonds (1,000,000 × 95%) | 950,000 |\n| Dividends paid | (400,000) |\n| **Net cash from financing activities** | **550,000** |\n\n### (e) Ending cash\n\nNet increase = 1,247,000 − 1,170,000 + 550,000 = 627,000. Cash = 400,000 + 627,000 = **₱1,027,000**, which agrees with the statement of financial position.", "trap": "Using interest expense (₱215,000) as interest paid without removing the discount amortization and the change in interest payable."}, {"no": 5, "title": "Investments, and Option 1 versus Option 2", "subtopic": "Investments and Option 1 vs Option 2", "difficulty": "difficult", "problem": "| Statement of financial position | Dec. 31, 20x2 | Dec. 31, 20x1 |\n|---|---|---|\n| **ASSETS** |  |  |\n| Cash | 336,000 | 700,000 |\n| Accounts receivable | 520,000 | 450,000 |\n| Inventory | 640,000 | 600,000 |\n| Investment in associate | 1,320,000 | 1,200,000 |\n| Equity investments at FVOCI | 700,000 | 500,000 |\n| Bond investment at amortized cost | 400,000 | – |\n| Equipment | 2,500,000 | 2,500,000 |\n| Accumulated depreciation | (1,050,000) | (800,000) |\n| **Total assets** | **5,366,000** | **5,150,000** |\n| **LIABILITIES AND EQUITY** |  |  |\n| Accounts payable | 410,000 | 380,000 |\n| Accrued operating expenses | 65,000 | 50,000 |\n| Income tax payable | 55,000 | 45,000 |\n| Loan payable | 700,000 | 1,000,000 |\n| Share capital | 2,000,000 | 2,000,000 |\n| Fair value reserve (OCI) | 90,000 | 50,000 |\n| Retained earnings | 2,046,000 | 1,625,000 |\n| **Total liabilities and equity** | **5,366,000** | **5,150,000** |\n\nStatement of profit or loss for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Sales (all on account) | 5,200,000 |\n| Cost of goods sold | (3,100,000) |\n| Operating expenses (excluding depreciation) | (900,000) |\n| Depreciation | (250,000) |\n| Share in profit of associate | 180,000 |\n| Dividend income (FVOCI investments, received in cash) | 25,000 |\n| Interest income (bond investment, received in cash) | 16,000 |\n| Interest expense (paid in cash) | (100,000) |\n| Income tax expense | (300,000) |\n| **Profit for the year** | **771,000** |\n\nAdditional information: the bond investment was bought at face value; no investments were sold; the fair value reserve changed only because of FVOCI remeasurement; the only change in retained earnings other than profit was cash dividends.", "requirements": ["Dividends received from the associate and purchases of FVOCI investments.", "Statement of cash flows under Option 1 (indirect method for operating activities).", "Net cash from operating, investing and financing activities under Option 2.", "Cash on December 31, 20x2."], "answer": "(a) dividends from associate ₱60,000; FVOCI purchases ₱160,000\n(b) operating ₱846,000; investing ₱(560,000); financing ₱(650,000)\n(c) Option 2: operating ₱495,000; investing ₱(459,000); financing ₱(400,000)\n(d) ₱336,000", "approach": "Squeeze dividends from the associate out of the investment account. Then move interest and dividends between sections according to the option used; the net change in cash never changes.", "solution": "### (a) Investment squeezes\n\n**Investment in associate**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| Beginning | 1,200,000 | **Dividends received (squeeze)** | **60,000** |\n| Share in profit | 180,000 | Ending | 1,320,000 |\n| **Total** | **1,380,000** | **Total** | **1,380,000** |\n\n**Equity investments at FVOCI**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| Beginning | 500,000 | Ending | 700,000 |\n| **Purchases (squeeze)** | **160,000** |  |  |\n| Fair value gain (90,000 − 50,000) | 40,000 |  |  |\n| **Total** | **700,000** | **Total** | **700,000** |\n\n### (b) Option 1\n\n| Particulars | Amount |\n|---|---|\n| Profit for the year | 771,000 |\n| Depreciation | 250,000 |\n| Share in profit of associate | (180,000) |\n| Dividends received from associate | 60,000 |\n| Increase in accounts receivable | (70,000) |\n| Increase in inventory | (40,000) |\n| Increase in accounts payable | 30,000 |\n| Increase in accrued operating expenses | 15,000 |\n| Increase in income tax payable | 10,000 |\n| **Net cash from operating activities** | **846,000** |\n| Purchase of FVOCI investments | (160,000) |\n| Purchase of bond investment | (400,000) |\n| **Net cash used in investing activities** | **(560,000)** |\n| Repayment of loan (1,000,000 − 700,000) | (300,000) |\n| Dividends paid (1,625,000 + 771,000 − 2,046,000) | (350,000) |\n| **Net cash used in financing activities** | **(650,000)** |\n\nThe FVOCI dividend income (₱25,000), interest income (₱16,000) and interest expense (₱100,000) were all received or paid in cash, so under Option 1 they need no adjustment: they are already in profit and they are operating.\n\n### (c) Option 2\n\n| Particulars | Amount |\n|---|---|\n| Operating under Option 1 | 846,000 |\n| Less: dividends received (60,000 + 25,000), moved to investing | (85,000) |\n| Less: interest received, moved to investing | (16,000) |\n| Add back: interest paid, moved to financing | 100,000 |\n| Less: dividends paid, moved to operating | (350,000) |\n| **Net cash from operating activities** | **495,000** |\n| **Investing under Option 1 + interest and dividends received (−560,000 + 85,000 + 16,000)** | **(459,000)** |\n| **Financing: loan repayment and interest paid (−300,000 − 100,000)** | **(400,000)** |\n\n### (d) Ending cash\n\nBoth options give the same net decrease of 364,000. Cash = 700,000 − 364,000 = **₱336,000**.", "trap": "Adding back the ₱25,000 FVOCI dividend income as if it were non-cash, when it was received in cash."}, {"no": 6, "title": "Two-year problem (find cash for each year)", "subtopic": "Multi-year statements", "difficulty": "difficult", "problem": "Entity F's statements of financial position show only the 20x1 cash balance.\n\n| Statement of financial position | Dec. 31, 20x3 | Dec. 31, 20x2 | Dec. 31, 20x1 |\n|---|---|---|---|\n| **ASSETS** |  |  |  |\n| Cash | ? | ? | 200,000 |\n| Accounts receivable | 330,000 | 360,000 | 300,000 |\n| Inventory | 500,000 | 440,000 | 400,000 |\n| Prepaid expenses | 15,000 | 25,000 | 20,000 |\n| Property, plant and equipment | 2,100,000 | 1,800,000 | 1,500,000 |\n| Accumulated depreciation | (630,000) | (600,000) | (450,000) |\n| **Total assets** | **?** | **?** | **1,970,000** |\n| **LIABILITIES AND EQUITY** |  |  |  |\n| Accounts payable | 230,000 | 270,000 | 250,000 |\n| Accrued expenses | 45,000 | 40,000 | 30,000 |\n| Income tax payable | 30,000 | 40,000 | 35,000 |\n| Notes payable (long-term) | 400,000 | 600,000 | 500,000 |\n| Share capital | 1,050,000 | 800,000 | 800,000 |\n| Retained earnings | 693,000 | 535,000 | 355,000 |\n| **Total liabilities and equity** | **?** | **?** | **1,970,000** |\n\nStatements of profit or loss:\n\n| Item | 20x3 | 20x2 |\n|---|---|---|\n| Sales | 3,400,000 | 3,000,000 |\n| Cost of goods sold | (2,050,000) | (1,800,000) |\n| Operating expenses (excluding depreciation) | (676,000) | (600,000) |\n| Depreciation | (170,000) | (150,000) |\n| Loss on sale of PPE | (10,000) | – |\n| Interest expense (paid in cash) | (54,000) | (50,000) |\n| Income tax expense | (132,000) | (120,000) |\n| **Profit for the year** | **308,000** | **280,000** |\n\nAdditional information: no PPE was sold in 20x2. In 20x3, PPE costing ₱200,000 was sold. All PPE purchases, borrowings, repayments, share issuances and dividends were in cash.", "requirements": ["Net cash from operating activities for 20x2 and for 20x3 (indirect method).", "Cash paid to suppliers in 20x3.", "Proceeds from the PPE sold in 20x3, and PPE purchases in each year.", "Net cash from (used in) investing and financing activities for each year.", "Cash on December 31, 20x2 and on December 31, 20x3."], "answer": "(a) 20x2 ₱360,000; 20x3 ₱423,000\n(b) ₱2,150,000\n(c) proceeds ₱50,000; purchases 20x2 ₱300,000, 20x3 ₱500,000\n(d) 20x2: investing ₱(300,000), financing ₱0; 20x3: investing ₱(450,000), financing ₱(100,000)\n(e) ₱260,000 and ₱133,000", "approach": "Treat each year as its own statement: 20x1 → 20x2, then 20x2 → 20x3. The ending cash of one year is the beginning cash of the next.", "solution": "### (a) Operating activities\n\n| Particulars | 20x3 | 20x2 |\n|---|---|---|\n| Profit for the year | 308,000 | 280,000 |\n| Depreciation | 170,000 | 150,000 |\n| Loss on sale of PPE | 10,000 | – |\n| (Increase) decrease in accounts receivable | 30,000 | (60,000) |\n| Increase in inventory | (60,000) | (40,000) |\n| (Increase) decrease in prepaid expenses | 10,000 | (5,000) |\n| Increase (decrease) in accounts payable | (40,000) | 20,000 |\n| Increase in accrued expenses | 5,000 | 10,000 |\n| Increase (decrease) in income tax payable | (10,000) | 5,000 |\n| **Net cash from operating activities** | **423,000** | **360,000** |\n\n### (b) Cash paid to suppliers in 20x3\n\nCOGS 2,050,000 + increase in inventory 60,000 + decrease in AP 40,000 = **₱2,150,000**.\n\n### (c) PPE\n\n**Accumulated depreciation (20x3)**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| **On PPE sold (squeeze)** | **140,000** | Beginning | 600,000 |\n| Ending | 630,000 | Depreciation | 170,000 |\n| **Total** | **770,000** | **Total** | **770,000** |\n\nCarrying amount = 200,000 − 140,000 = 60,000; proceeds = 60,000 − loss 10,000 = **₱50,000**.\n\n**PPE (20x3)**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| Beginning | 1,800,000 | Cost of PPE sold | 200,000 |\n| **Purchases (squeeze)** | **500,000** | Ending | 2,100,000 |\n| **Total** | **2,300,000** | **Total** | **2,300,000** |\n\nIn 20x2 nothing was sold, so purchases = 1,800,000 − 1,500,000 = **₱300,000**.\n\n### (d) Investing and financing\n\n| Particulars | 20x3 | 20x2 |\n|---|---|---|\n| Proceeds from sale of PPE | 50,000 | – |\n| Purchase of PPE | (500,000) | (300,000) |\n| **Net cash used in investing activities** | **(450,000)** | **(300,000)** |\n| Proceeds from (repayment of) notes payable | (200,000) | 100,000 |\n| Proceeds from issuing shares | 250,000 | – |\n| Dividends paid | (150,000) | (100,000) |\n| **Net cash from (used in) financing activities** | **(100,000)** | **0** |\n\nDividends: 20x2 = 355,000 + 280,000 − 535,000 = 100,000; 20x3 = 535,000 + 308,000 − 693,000 = 150,000.\n\n### (e) Cash each year\n\n20x2: 360,000 − 300,000 + 0 = +60,000, so cash = 200,000 + 60,000 = **₱260,000**.\n\n20x3: 423,000 − 450,000 − 100,000 = (127,000), so cash = 260,000 − 127,000 = **₱133,000**.", "trap": "Using the 20x1 cash as the beginning balance for 20x3."}, {"no": 7, "title": "Harder comprehensive (lease, stock dividend, treasury shares, prior period error, FX)", "subtopic": "Leases, equity transactions and FX", "difficulty": "difficult", "problem": "| Statement of financial position | Dec. 31, 20x2 | Dec. 31, 20x1 |\n|---|---|---|\n| **ASSETS** |  |  |\n| Cash (includes a US dollar account) | 416,000 | 600,000 |\n| Accounts receivable | 950,000 | 800,000 |\n| Inventory | 1,000,000 | 1,100,000 |\n| Prepaid expenses | 55,000 | 40,000 |\n| Right-of-use asset | 640,000 | – |\n| Building and equipment | 6,700,000 | 6,000,000 |\n| Accumulated depreciation – building and equipment | (2,600,000) | (2,000,000) |\n| Patent | 250,000 | 300,000 |\n| **Total assets** | **7,411,000** | **6,840,000** |\n| **LIABILITIES AND EQUITY** |  |  |\n| Accounts payable | 760,000 | 700,000 |\n| Accrued operating expenses | 70,000 | 90,000 |\n| Income tax payable | 90,000 | 100,000 |\n| Lease liability | 660,000 | – |\n| Bank loan | 800,000 | 1,200,000 |\n| Share capital (₱10 par) | 3,300,000 | 3,000,000 |\n| Share premium | 750,000 | 600,000 |\n| Retained earnings | 1,161,000 | 1,150,000 |\n| Treasury shares, at cost | (180,000) | – |\n| **Total liabilities and equity** | **7,411,000** | **6,840,000** |\n\nStatement of profit or loss for 20x2:\n\n| Particulars | Amount |\n|---|---|\n| Sales (all on account) | 9,000,000 |\n| Cost of goods sold | (5,400,000) |\n| Operating expenses (excluding depreciation and amortization) | (1,500,000) |\n| Depreciation (building and equipment ₱500,000; right-of-use asset ₱160,000) | (660,000) |\n| Amortization of patent | (50,000) |\n| Foreign exchange gain on the US dollar bank account | 14,000 |\n| Interest expense (bank loan ₱94,000 paid in cash; lease ₱80,000) | (174,000) |\n| Income tax expense | (369,000) |\n| **Profit for the year** | **861,000** |\n\nAdditional information:\n\n(1) On January 1, 20x2, the entity began a 5-year lease, recognizing a right-of-use asset and lease liability of ₱800,000. The annual payment of ₱220,000 is due every December 31; the implicit rate is 10%.\n\n(2) In 20x2, the entity discovered that 20x1 depreciation had been understated by ₱100,000. The correction was made through retained earnings (ignore tax).\n\n(3) A 10% stock dividend was issued when the shares were worth ₱15 each.\n\n(4) No building or equipment was sold. Treasury shares were bought for cash. Cash dividends were declared and paid.", "requirements": ["Net cash from operating activities (indirect method).", "Net cash used in investing activities.", "Net cash used in financing activities.", "How is the foreign exchange gain presented?", "Prove the ending cash balance.", "List the non-cash transactions to be disclosed."], "answer": "(a) ₱1,522,000\n(b) ₱(700,000)\n(c) ₱(1,020,000)\n(d) gain deducted in operating; ₱14,000 shown as a separate reconciling line\n(e) ₱416,000\n(f) ROU asset/lease liability ₱800,000; stock dividend ₱450,000", "approach": "Reconcile every equity and accumulated depreciation change before adding anything back: a stock dividend and a prior period error correction are not cash flows.", "solution": "### (a) Operating activities\n\n| Particulars | Amount |\n|---|---|\n| Profit for the year | 861,000 |\n| Depreciation (building and equipment 500,000 + ROU 160,000) | 660,000 |\n| Amortization of patent | 50,000 |\n| Foreign exchange gain on cash | (14,000) |\n| Increase in accounts receivable | (150,000) |\n| Decrease in inventory | 100,000 |\n| Increase in prepaid expenses | (15,000) |\n| Increase in accounts payable | 60,000 |\n| Decrease in accrued operating expenses | (20,000) |\n| Decrease in income tax payable | (10,000) |\n| **Net cash from operating activities** | **1,522,000** |\n\nTrap: accumulated depreciation rose by 600,000, but only 500,000 is depreciation expense. The other 100,000 is the prior period error correction charged to retained earnings: no cash, and not an add-back.\n\n**Accumulated depreciation**\n| Debit |   | Credit |   |\n|---|---|---|---|\n| Ending | 2,600,000
